          const BANDS = ["#bf1", "#bf2", "#bf3", "#bf4"], LABELS = ["#bl1", "#bl2", "#bl3", "#bl4"];
          tl.set("#fnBox", CENTER, 0);
          tl.set([...BANDS, ...LABELS], { opacity: 0 }, 0);
          tl.set(".bo", { strokeDasharray: 1, strokeDashoffset: 1 }, 0);
          const fillBand = (k, t) => {
            tl.fromTo(BANDS[k], { opacity: 0 }, { opacity: k === 3 ? 1 : 0.92, duration: 0.55, ease: "power2.out" }, t);
            tl.fromTo(LABELS[k], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, t + 0.15);
          };

          // ---------- 01 HOOK ----------
          tl.fromTo("#s1logo", { opacity: 0 }, { opacity: 0.9, duration: 0.8, ease: "power1.out" }, 0.05);
          tl.to("#s1logo", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, We(8) + 0.05);
          const h1 = $$(".h1"), h2 = $$(".h2");
          h1.forEach((el, i) => rise(el, W(i) - 0.08, 0.5, 30));
          h2.forEach((el, i) => rise(el, W(5 + i) - 0.08, 0.5, 30));
          rise("#ph1", 0.1, 0.7, 60);
          tl.fromTo("#p1", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, 0.35);
          tl.set("#shrug", { opacity: 0 }, 0);
          // the person shrugs at the ad …
          tl.to("#p1", { scaleY: 0.92, y: 8, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 100%" }, W(7));
          tl.fromTo("#shrug", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, W(7));
          tl.to("#shrug", { opacity: 0, duration: 0.2 }, W(8) + 0.3);
          // … and scrolls straight past it
          tl.to("#feed1", { y: -760, duration: 0.65, ease: "power3.inOut" }, W(8) + 0.05);
          out(["#s1 .row", "#ph1", "#p1"], SC("s1")[1] - 0.3, 0.25);

          // ---------- 02 STRANGER ----------
          const T2 = SC("s2")[0];
          tl.set(["#q2", "#l2", "#ad2", "#arr2"], { opacity: 0 }, 0);
          rise("#pS", T2 + 0.05, 0.5, 30);
          rise("#pY", T2 + 0.15, 0.5, 30);
          pop("#ad2", W(11) - 0.1, 0.4);
          // the ad fires at the stranger and bounces off
          tl.fromTo("#arr2", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.in" }, W(13) - 0.15);
          tl.to("#arr2", { x: 150, y: 110, rotation: 30, opacity: 0, duration: 0.55, ease: "power2.out" }, W(13) + 0.25);
          pulse("#pS", W(13) + 0.25, 1.06);
          pop("#q2", W(14), 0.45);
          rise("#l2", W(15) - 0.05, 0.45, 20);
          out(["#q2", "#pS", "#pY", "#ad2", "#l2"], SC("s2")[1] - 0.3, 0.25);

          // ---------- 03 TERM ----------
          tl.set(["#t3", "#p3", "#cart3", "#pathHead"], { opacity: 0 }, 0);
          tl.set("#path3", { scaleY: 0 }, 0);
          tl.fromTo("#t3", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "expo.out" }, W(19) - 0.08);
          glow(W(19), 540, 380, 0.6, 0.8, 0.6);
          // the empty funnel draws itself, band by band
          tl.to(".bo", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.18 }, W(21) - 0.1);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, W(22));
          // the path: from first contact (top) to the purchase (bottom)
          pop("#p3", W(26) - 0.05, 0.45);
          tl.to("#path3", { scaleY: 1, duration: We(33) - W(27), ease: "power1.inOut" }, W(27));
          tl.fromTo("#pathHead", { opacity: 0 }, { opacity: 1, duration: 0.15 }, We(33) - 0.1);
          pop("#cart3", W(33) - 0.05, 0.5);
          out(["#t3", "#p3", "#path3", "#pathHead", "#cart3"], SC("s3")[1] - 0.35, 0.3);

          // ---------- the cafe street (04-08) ----------
          const T4 = SC("s4")[0];
          tl.to("#fnBox", { ...SIDE, duration: 0.8, ease: "power3.inOut" }, T4 - 0.1);
          tl.set(["#seat1", "#seat2", "#custIn", "#cup", "#rev", "#cal", ".calp", "#fr1", "#fr2", "#cust", "#eye5", "#c4"], { opacity: 0 }, 0);
          tl.set(".rs", { opacity: 0.2 }, 0);
          tl.set(".stm", { opacity: 0 }, 0);
          tl.fromTo("#cafeDraw .cp", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut", stagger: 0.09 }, W(35) - 0.1);
          tl.to("#cup", { opacity: 1, duration: 0.4 }, W(37));
          tl.fromTo("#c4", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, W(36) - 0.05);
          out("#c4", SC("s4")[1] - 0.3, 0.25);

          // ---------- 05 AWARENESS: walks past, notices ----------
          tl.set(["#t5", "#c5"], { opacity: 0 }, 0);
          tl.set("#cust", { x: 1020 }, 0);
          tl.to("#cust", { opacity: 1, duration: 0.25 }, W(40) - 0.2);
          walk("#cust", W(40) - 0.2, 620, W(44) - W(40) + 0.1);
          tl.set("#eye5", { x: 624, opacity: 0 }, 0);
          pop("#eye5", W(44), 0.4);
          tl.to("#eye5", { opacity: 0, duration: 0.3 }, W(45) + 0.3);
          tl.fromTo("#c5", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, W(44));
          fillBand(0, W(47) - 0.1);
          rise("#t5", W(47) - 0.1, 0.55, 30);
          const exit5 = Math.min(1.2, SC("s5")[1] - (W(45) + 0.2) - 0.05); // walks on, gone before scene 06
          walk("#cust", W(45) + 0.2, 420, exit5);
          tl.to("#cust", { opacity: 0, duration: 0.25 }, W(45) + 0.2 + exit5 - 0.25);
          out(["#t5", "#c5"], SC("s5")[1] - 0.3, 0.25);

          // ---------- 06 CONSIDERATION: smell, people, reviews ----------
          tl.set(["#t6", "#c6a", "#c6b", "#c6c", "#d6a", "#d6b"], { opacity: 0 }, 0);
          tl.set("#cust", { x: 420 }, SC("s6")[0]);
          tl.to("#cust", { opacity: 1, duration: 0.3 }, SC("s6")[0]);
          walk("#cust", SC("s6")[0], 560, 0.7);
          // smell: steam rises from the cup
          tl.to(".stm", { opacity: 1, duration: 0.3 }, W(49) - 0.1);
          tl.fromTo(".stm", { y: 2 }, { y: -2, duration: 0.5, yoyo: true, repeat: 7, ease: "sine.inOut" }, W(49) - 0.1);
          tl.fromTo("#c6a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(49) - 0.05);
          // people sitting inside
          tl.to("#d6a", { opacity: 1, duration: 0.3 }, W(51) - 0.1);
          rise("#seat1", W(51) - 0.05, 0.45, 16);
          rise("#seat2", W(52) - 0.05, 0.45, 16);
          tl.fromTo("#c6b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(51) - 0.05);
          // reviews: three outline stars
          tl.to("#d6b", { opacity: 1, duration: 0.3 }, W(54) - 0.1);
          pop("#rev", W(54) - 0.15, 0.45);
          tl.to(".rs", { opacity: 1, duration: 0.25, stagger: 0.12 }, W(54) + 0.15);
          tl.fromTo("#c6c", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(54) - 0.05);
          fillBand(1, W(59) - 0.1);
          rise("#t6", W(59) - 0.1, 0.55, 30);
          out(["#t6", "#c6a", "#c6b", "#c6c", "#d6a", "#d6b"], SC("s6")[1] - 0.3, 0.25);

          // ---------- 07 DECISION: walks in, first cup ----------
          tl.set(["#t7", "#c7"], { opacity: 0 }, 0);
          walk("#cust", W(61) - 0.1, 840, 0.75);
          tl.to("#cust", { opacity: 0, scale: 0.9, duration: 0.25 }, W(61) + 0.6);
          out(["#seat1", "#seat2", "#rev"], W(61), 0.3);
          tl.to(".stm", { opacity: 0, duration: 0.3 }, W(61));
          rise("#custIn", W(62) - 0.05, 0.4, 14);
          tl.to("#cup", { x: 110, duration: 0.6, ease: "power3.out" }, W(63) - 0.1);
          tl.to(".stm", { opacity: 1, duration: 0.3 }, W(63) + 0.4);
          tl.fromTo("#c7", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, W(63) - 0.05);
          fillBand(2, W(67) - 0.1);
          rise("#t7", W(67) - 0.1, 0.55, 30);
          glow(W(67), 640, 860, 0.45, 0.5, 0.5);
          out(["#t7", "#c7"], SC("s7")[1] - 0.25, 0.2);

          // ---------- 08 LOYALTY: back every day, brings friends ----------
          const T8 = SC("s8")[0];
          tl.set(["#t8", "#c8a", "#c8b", "#d8"], { opacity: 0 }, 0);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, T8);
          out(["#custIn", "#cup"], T8, 0.3);
          pop("#cal", W(69) - 0.1, 0.45);
          // three visits, one per calendar page
          // evenly spaced over "بترجع كل يوم" (the read is quick here, so the beat sets the rhythm, not each word)
          const visits = [0, 1, 2].map((k) => W(70) - 0.15 + k * 0.38);
          const calp = $$(".calp");
          visits.forEach((t, k) => {
            tl.fromTo(calp[k], { opacity: 0, scaleY: 0.2, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" }, t);
            tl.fromTo("#cust", { x: 1000, opacity: 1, scale: 1 }, { x: 840, duration: 0.3, ease: "power1.out", immediateRender: false }, t);
            tl.to("#cust", { opacity: 0, duration: 0.12 }, t + 0.28);
          });
          tl.fromTo("#c8a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(70));
          // … and tells friends
          tl.set("#cust", { x: 720, scale: 1 }, W(73) - 0.2);
          tl.to("#cust", { opacity: 1, duration: 0.25 }, W(73) - 0.2);
          rise("#fr1", W(74) - 0.05, 0.45, 20);
          rise("#fr2", W(74) + 0.1, 0.45, 20);
          tl.to("#d8", { opacity: 1, duration: 0.3 }, W(74) - 0.1);
          tl.fromTo("#c8b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(74) - 0.05);
          fillBand(3, W(77) - 0.1);
          rise("#t8", W(77) - 0.1, 0.55, 30);
          out(["#t8", "#c8a", "#c8b", "#d8"], SC("s8")[1] - 0.3, 0.25);
          out(["#cafeDraw", "#cal", "#cust", "#fr1", "#fr2"], SC("cafe")[1] - 0.35, 0.3);

          // ---------- 09 THE MISTAKE ----------
          const T9 = SC("s9")[0];
          tl.to("#fnBox", { ...CENTER, duration: 0.8, ease: "power3.inOut" }, T9 - 0.15);
          tl.set(["#t9", "#x9", "#ad9a", "#ad9b"], { opacity: 0 }, 0);
          // the "buy now" ad jumps straight at the top band …
          const AD = ["#ad9a", "#ad9b"];
          tl.fromTo(AD, { opacity: 0, x: 320, y: 0, rotation: 10 }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.4, ease: E }, W(80) - 0.1);
          tl.to(AD, { y: -640, scale: 0.85, duration: 0.45, ease: "power3.in" }, W(82));
          // … hits it and breaks
          const HIT = W(82) + 0.45;
          tl.to("#ad9a", { x: -220, y: -560, rotation: -28, opacity: 0, duration: 0.8, ease: "power2.out" }, HIT);
          tl.to("#ad9b", { x: 220, y: -540, rotation: 26, opacity: 0, duration: 0.8, ease: "power2.out" }, HIT);
          tl.fromTo("#fnBox", { x: 0 }, { x: 8, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, HIT);
          tl.fromTo("#x9", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, HIT + 0.1);
          glow(HIT, 540, 640, 0.75, 0.6, 0.3);
          rise("#t9", W(86) - 0.1, 0.55, 30);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s9")[1] - 0.5);
          out(["#t9", "#x9"], SC("s9")[1] - 0.35, 0.3);

          // ---------- 10 THE MESSAGES ----------
          const T10 = SC("s10")[0];
          tl.to("#fnBox", { ...LEFT, duration: 0.8, ease: "power3.inOut" }, T10 - 0.05);
          tl.set([".tag"], { opacity: 0 }, 0);
          tl.set([".conn"], { scaleX: 0 }, 0);
          // "each stage has its message": the bands answer one by one
          [W(90), W(91), W(93), W(94)].forEach((t, k) => tl.fromTo(BANDS[k], { opacity: k === 3 ? 1 : 0.92 }, { opacity: 0.45, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.inOut" }, t));
          const tagIn = (k, t) => {
            tl.to(`#cn${k}`, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t);
            tl.fromTo(`#tg${k}`, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.5, ease: "back.out(1.6)" }, t + 0.1);
          };
          tagIn(1, W(98) - 0.15);
          tagIn(2, W(103) - 0.15);
          tagIn(3, W(108) - 0.15);
          // the bottom band gets no tag here: it steps back (label turns off-white so it stays readable)
          tl.to("#bf4", { opacity: 0.35, duration: 0.4 }, W(95));
          tl.to("#bl4", { color: "#F5F1EA", duration: 0.4 }, W(95));
          tl.to("#bf4", { opacity: 1, duration: 0.4 }, SC("s10")[1] - 0.4);
          tl.to("#bl4", { color: "#1A1A1A", duration: 0.4 }, SC("s10")[1] - 0.4);
          out(["#s10 .tag", "#s10 .conn"], SC("s10")[1] - 0.35, 0.3);

          // ---------- 11 DROP-OFF ----------
          const T11 = SC("s11")[0];
          tl.to("#fnBox", { ...CENTER, duration: 0.8, ease: "power3.inOut" }, T11 - 0.05);
          tl.set(["#dp1", "#dp2", "#dp3", "#mag", "#c11"], { opacity: 0 }, 0);
          // a few people quietly step out at different stages
          const drop = (el, t, dx) => {
            tl.fromTo(el, { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.3 }, t);
            tl.to(el, { x: dx, duration: 0.5, ease: "power1.out" }, t + 0.25);
            tl.to(el, { y: 220, opacity: 0, duration: 0.9, ease: "power1.in" }, t + 0.7);
          };
          drop("#dp1", W(113) - 0.1, 90);
          drop("#dp2", W(114) - 0.05, -90);
          drop("#dp3", W(115) + 0.1, 90);
          // where are you losing them? the magnifier stops on one stage
          tl.fromTo("#mag", { opacity: 0, x: 0, y: 0 }, { opacity: 1, duration: 0.35 }, W(118) - 0.1);
          tl.to("#mag", { x: -325, y: 160, duration: 0.7, ease: "power2.inOut" }, W(118) + 0.1);
          tl.to("#mag", { y: 343, duration: 0.6, ease: "power2.inOut" }, W(119) + 0.15);
          tl.fromTo("#mag", { scale: 1 }, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, W(120) + 0.1);
          tl.to("#bf2", { opacity: 1, duration: 0.3 }, W(120) + 0.1);
          tl.to(["#bf1", "#bf3", "#bf4"], { opacity: 0.35, duration: 0.4 }, W(120) + 0.1);
          tl.to(["#bl1", "#bl3", "#bl4"], { color: "#F5F1EA", opacity: 0.7, duration: 0.4 }, W(120) + 0.1);
          tl.fromTo("#c11", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, W(120) - 0.05);
          glow(W(120), 540, 800, 0.6, 0.6, 0.5);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s11")[1] - 0.5);
          out(["#fnBox", "#mag", "#c11"], SC("s11")[1] - 0.35, 0.3);

          // ---------- 12 CTA ----------
          const T12 = SC("s12")[0];
          const K = ["#k1", "#k2", "#k3", "#k4"];
          tl.set([...K, "#arr12"], { opacity: 0 }, 0);
          tl.fromTo("#bub12", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.6)", transformOrigin: "20% 90%" }, T12 + 0.15);
          K.forEach((k, i) => tl.fromTo(k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(124) - 0.1 + i * 0.12));
          // the chips light up in turn, like a tap
          K.forEach((k, i) => tl.to(k, { borderColor: ORANGE, backgroundColor: "rgba(255,77,26,0.12)", duration: 0.2, yoyo: true, repeat: 1, ease: "power1.inOut" }, W(126) + i * 0.3));
          tl.fromTo("#arr12", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, W(128) - 0.05);
          tl.to("#arr12", { y: 18, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(128) + 0.35);
          glow(W(124), 540, 760, 0.55, 0.9, 0.7);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, END - 0.6);
          out("#s12 > *", END - 0.5, 0.4);

          // ---------- 13 END CARD ----------
          tl.fromTo("#s13logo", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, END + 0.1);

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
        else build();
      })();
    </script>
  </body>
</html>

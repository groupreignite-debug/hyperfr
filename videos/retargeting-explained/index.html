            .cursor { position: absolute; width: 58px; height: 58px; }

          $$("[data-ic]").forEach((el) => { el.innerHTML = `<svg class="ic" viewBox="0 0 24 24" style="width:100%;height:100%">${ICON[el.dataset.ic]}</svg>`; });
          $$("[data-jacket]").forEach((el) => (el.innerHTML = JACKET));
          $$("[data-person]").forEach((el) => (el.innerHTML = PERSON));
          $$("[data-cursor]").forEach((el) => (el.innerHTML = CURSOR));
          $$(".feed").forEach((el) => (el.innerHTML = FEED));

          const tl = gsap.timeline({ paused: true });
          const DUR = CUES.duration, END = CUES.endcard;
          const rise = (el, t, d = 0.7, y = 44) => tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: E }, t);
          const out = (el, t, d = 0.35) => tl.to(el, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const pop = (el, t, d = 0.5) => tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
          const pulse = (el, t, s = 1.08) => tl.fromTo(el, { scale: 1 }, { scale: s, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, t);
          const ring = (el, t) => tl.fromTo(el, { opacity: 0.9, scale: 0.3 }, { opacity: 0, scale: 1.6, duration: 0.6, ease: "power2.out", immediateRender: false }, t);
          const glow = (t, x, y, op, s = 1, d = 0.8) => tl.to("#glow", { x: x - 540, y: y - 960, opacity: op, scale: s, duration: d, ease: "power2.inOut" }, t);
          const words = (els, t, gap = 0.12, y = 34) => els.forEach((el, i) => rise(el, t + i * gap, 0.55, y));

          // ---------- ground ----------
          tl.fromTo("#grid", { x: 0, y: 0 }, { x: 72, y: 144, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#marks", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 0.2);
          tl.fromTo("#progfill", { scaleX: 0 }, { scaleX: 1, duration: END - 0.4, ease: "none" }, 0.4);
          tl.to(["#grid", "#marks", "#prog"], { opacity: 0, duration: 0.8, ease: "power1.inOut" }, END - 0.4);

          // ---------- subtitles ----------
          const host = $("#subs");
          SUBS.forEach(([wi, html], i) => {
            const d = document.createElement("div");
            d.className = "sub";
            d.innerHTML = `<span>${html}</span>`;
            host.appendChild(d);
            const t = Math.max(0.06, W(wi));
            const next = i + 1 < SUBS.length ? W(SUBS[i + 1][0]) : END;
            const sameLine = i + 1 < SUBS.length && lineEndFor(SUBS[i + 1][0]) === lineEndFor(wi);
            const hide = sameLine ? next - 0.18 : Math.min(lineEndFor(wi) + 0.45, next - 0.18);
            tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t - 0.06);
            tl.to(d, { opacity: 0, duration: 0.12, ease: "none" }, hide);
          });

          // ---------- 01 HOOK ----------
          // 0–1.2s teaser of the twist: frame 0 is already full (jacket + three feeds), the jacket pops into
          // each feed inside 0.3s, lunges at the camera and لاحقك؟ stamps at ~0.8s. Then a rewind to the setup.
          const TAP = Math.max(W(5), 1.9);
          tl.set(["#hk", "#rew", "#ph1", "#c1a", "#c1b"], { opacity: 0 }, 0);
          tl.fromTo("#j1", { scale: 1, rotation: 0 }, { scale: 1.04, rotation: -2, duration: 0.3, ease: "sine.out" }, 0);
          ["#tj1", "#tj2", "#tj3"].forEach((j, i) => tl.fromTo(j, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.6)" }, 0.05 + i * 0.12));
          tl.to("#j1", { scale: 1.3, y: 30, rotation: 0, boxShadow: "0 50px 90px rgba(0,0,0,0.65)", duration: 0.24, ease: "power3.out" }, 0.78);
          tl.to(["#tf1", "#tf2", "#tf3"], { opacity: 0.2, duration: 0.2 }, 0.8);
          tl.fromTo("#hk", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out", transformOrigin: "50% 55%" }, 0.82);
          tl.to("#hk", { keyframes: { x: [0, -16, 13, -9, 6, 0] }, duration: 0.24, ease: "none" }, 1.0);
          glow(0.8, 540, 1100, 0.85, 0.7, 0.25);
          // rewind: everything flies back the way it came
          tl.to("#rew", { opacity: 1, duration: 0.06 }, 1.18);
          tl.to("#rew", { keyframes: { x: [0, -12, 0, -12, 0] }, duration: 0.36, ease: "none" }, 1.18);
          tl.to("#rew", { opacity: 0, duration: 0.15 }, 1.55);
          tl.to("#hk", { opacity: 0, scale: 0.8, duration: 0.15, ease: "power2.in" }, 1.2);
          tl.to("#glow", { opacity: 0, duration: 0.25 }, 1.2);
          tl.to("#tf1", { x: 640, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.22);
          tl.to("#tf2", { y: 820, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.25);
          tl.to("#tf3", { x: -640, opacity: 0, duration: 0.3, ease: "power2.in" }, 1.28);
          tl.to("#j1", { scale: 1, y: 0, boxShadow: "0 18px 40px rgba(0,0,0,0.35)", duration: 0.32, ease: "power3.inOut" }, 1.22);
          tl.fromTo("#ph1", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 1.38);
          // the setup, as the voice tells it: saw it, tapped it, left
          tl.fromTo("#c1a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, Math.max(W(4), 1.6));
          tl.fromTo("#cur1", { x: 840, y: 1250, opacity: 0 }, { opacity: 1, duration: 0.2 }, TAP - 0.5);
          tl.to("#cur1", { x: 552, y: 742, duration: 0.45, ease: "power2.inOut" }, TAP - 0.5);
          tl.to("#cur1", { scale: 0.82, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "10% 10%" }, TAP);
          ring("#r1", TAP);
          pulse("#j1", TAP, 1.05);
          tl.to("#cur1", { opacity: 0, duration: 0.2 }, TAP + 0.25);
          tl.to("#ph1", { y: 700, opacity: 0, duration: 0.6, ease: "power3.in" }, W(7) - 0.15);
          tl.fromTo("#c1b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(7));
          tl.to("#j1", { y: 100, duration: 0.8, ease: "power2.inOut" }, W(7) + 0.05);
          tl.to("#j1", { rotation: -3, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, We(7) - 0.2);
          out(["#c1a", "#c1b"], SC("s1")[1] - 0.35, 0.3);

          // ---------- 02 FOLLOW ----------
          const FOLLOW = SC("s2")[0];
          tl.set(["#lb1", "#lb2", "#lb3"], { opacity: 0 }, 0);
          tl.fromTo("#j2", { y: 0, rotation: 0 }, { y: -14, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, FOLLOW);
          tl.to("#j2", { y: -40, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, W(11));
          tl.to("#glow", { opacity: 0, duration: 0.4 }, W(13) - 0.3);
          // feed 1: Instagram — the same card flies into the feed
          tl.fromTo("#sc1", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, W(13) - 0.25);
          rise("#lb1", W(14) - 0.05, 0.45, 20);
          tl.to("#j2", { x: 375, y: 30, scale: 220 / 340, transformOrigin: "0% 0%", duration: 0.55, ease: "power3.inOut" }, W(14) - 0.1);
          tl.to("#j2", { scale: 0.7, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, W(14) + 0.45);
          // feed 2: YouTube
          tl.fromTo("#sc2", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, W(15) - 0.3);
          rise("#lb2", W(16) - 0.05, 0.45, 20);
          pop("#j2b", W(16));
          // feed 3: everywhere — and it drifts toward the viewer
          tl.fromTo("#sc3", { opacity: 0, x: 220 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, W(17) - 0.35);
          rise("#lb3", W(17) - 0.05, 0.45, 20);
          pop("#j2c", W(17) + 0.05);
          tl.to("#j2c", { x: 200, y: 120, scale: 1.45, boxShadow: "0 40px 80px rgba(0,0,0,0.6)", duration: 1.0, ease: "power2.inOut" }, W(17) + 0.5);
          // freeze → dim behind the question
          tl.to("#s2in", { opacity: 0.12, scale: 0.97, filter: "blur(8px)", duration: 0.55, ease: "power2.inOut", transformOrigin: "50% 50%" }, SC("s3")[0]);
          out("#s2in", SC("s2")[1] - 0.35, 0.3);

          // ---------- 03 FREEZE ----------
          rise("#s3q", W(19) - 0.1, 0.55, 40);
          tl.fromTo("#s3n", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out", transformOrigin: "50% 55%" }, W(20) - 0.04);
          glow(W(20), 540, 1030, 0.85, 0.6, 0.3);
          tl.to("#glow", { opacity: 0, duration: 0.3 }, SC("s3")[1] - 0.35);
          out(["#s3q", "#s3n"], SC("s3")[1] - 0.3, 0.25);

          // ---------- 04 TERM ----------
          const wch = $("#s4word");
          wch.innerHTML = "Retargeting".split("").map((c) => `<span class="w ch">${c}</span>`).join("");
          const chs = $$("#s4word .ch");
          const cw = chs.reduce((a, c) => a + c.offsetWidth, 0);
          if (cw > 880) wch.style.fontSize = parseFloat(getComputedStyle(wch).fontSize) * (880 / cw) + "px";
          const T4 = SC("s4")[0];
          tl.set([chs, "#s4p", "#s4j", "#s4i1", "#s4a1", "#s4i2", "#s4a2", "#s4i3"], { opacity: 0 }, 0);
          tl.fromTo("#s4caret", { opacity: 0 }, { opacity: 1, duration: 0.15 }, T4 + 0.05);
          tl.to("#s4caret", { opacity: 0, duration: 0.08 }, T4 + 0.35);
          tl.to("#s4caret", { opacity: 1, duration: 0.08 }, T4 + 0.55);
          tl.to("#s4caret", { opacity: 0, duration: 0.1 }, W(23) - 0.05);
          chs.forEach((c, i) => tl.fromTo(c, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.42, ease: E }, W(23) - 0.05 + i * 0.035));
          glow(W(23), 540, 560, 0.7, 0.85, 0.6);
          // the loop: out to the shop, and back to the same person
          rise("#s4p", W(23) + 0.3, 0.5, 20);
          pop("#s4j", W(23) + 0.45);
          tl.fromTo("#s4out", { strokeDashoffset: 0, opacity: 0 }, { opacity: 1, duration: 0.2 }, W(24) - 0.25);
          tl.fromTo("#s4cr", { attr: { width: 0 } }, { attr: { width: 520 }, duration: 0.7, ease: "power2.inOut" }, W(24) - 0.25);
          tl.fromTo("#s4back", { strokeDasharray: 640, strokeDashoffset: 640 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, W(25));
          tl.fromTo("#s4head", { opacity: 0 }, { opacity: 1, duration: 0.15 }, W(25) + 0.75);
          pulse("#s4p", W(25) + 0.8, 1.1);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, W(25));
          // saw you → didn't buy → reach them again (icons only; the sentence stays in the subtitle)
          pop("#s4i1", W(28) - 0.1, 0.4);
          tl.fromTo(["#s4a1", "#s4i2"], { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: E, stagger: 0.08 }, W(31) - 0.1);
          tl.fromTo(["#s4a2", "#s4i3"], { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.35, ease: E, stagger: 0.08 }, W(32) - 0.05);
          tl.to("#s4i3", { rotation: 180, duration: 0.5, ease: "power2.inOut" }, W(32) + 0.2);
          out("#s4 > *", SC("s4")[1] - 0.35, 0.3);

          // ---------- 05 SHOP ----------
          const T5 = SC("s5")[0];
          tl.set(["#j5", "#hook5", "#sales5", "#p5", "#p5in", "#bub5", "#bub5t", "#c5a", "#c5b", "#c5c"], { opacity: 0 }, 0);
          tl.fromTo("#shop .sp", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut", stagger: 0.07 }, T5 + 0.1);
          tl.to("#hook5", { opacity: 1, duration: 0.3 }, T5 + 0.7);
          tl.fromTo("#j5", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.6)" }, T5 + 0.8);
          tl.fromTo("#j5", { rotation: -3 }, { rotation: 3, duration: 0.7, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 0%" }, T5 + 1.3);
          // someone walks in …
          tl.fromTo("#p5", { x: -40, opacity: 0 }, { opacity: 1, duration: 0.3 }, W(37) - 0.55);
          tl.to("#p5", { x: 696, duration: 0.85, ease: "power1.inOut" }, W(37) - 0.55);
          tl.fromTo("#p5", { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut" }, W(37) - 0.55);
          tl.to("#p5", { opacity: 0, scale: 0.9, duration: 0.2 }, W(38) - 0.05);
          tl.fromTo("#c5a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(38));
          // … tries the jacket …
          tl.to("#p5in", { opacity: 1, duration: 0.2 }, W(39) - 0.1);
          pulse("#j5", W(39), 1.08);
          tl.fromTo("#c5b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(39));
          tl.to("#p5in", { opacity: 0, duration: 0.2 }, W(40) - 0.15);
          // … and leaves without buying
          tl.set("#p5", { x: 696, scale: 1 }, W(40) - 0.05);
          tl.to("#p5", { opacity: 1, duration: 0.15 }, W(40) - 0.05);
          tl.to("#p5", { x: 1120, duration: 0.8, ease: "power1.in" }, W(40) + 0.05);
          tl.fromTo("#c5c", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(43) - 0.1);
          // the good salesperson doesn't forget
          tl.fromTo("#sales5", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, W(44));
          tl.to(["#c5a", "#c5b", "#c5c"], { opacity: 0.25, duration: 0.4 }, W(44));
          glow(W(44) + 0.2, 737, 1060, 0.55, 0.4, 0.6);
          // he passes by again
          tl.to("#p5", { x: 860, duration: 1.0, ease: "power1.out" }, W(49) - 0.2);
          tl.fromTo("#p5", { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: 5, ease: "sine.inOut" }, W(49) - 0.2);
          tl.set("#p5", { opacity: 1 }, W(49) - 0.2);
          tl.fromTo(["#bub5", "#bub5t"], { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.8)", transformOrigin: "75% 100%" }, W(53) - 0.1);
          tl.to("#j5", { boxShadow: "0 0 40px 8px rgba(255,77,26,0.5)", duration: 0.5 }, W(53));
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s5")[1] - 0.6);
          out(["#shop", "#hook5", "#j5", "#p5", "#bub5", "#bub5t", "#c5a", "#c5b", "#c5c"], SC("s5")[1] - 0.45, 0.4);

          // ---------- 06 PIXEL ----------
          const T6 = SC("s6")[0];
          tl.set(["#s6lab", "#pgB", "#px6", "#cur6", "#m1", "#m2"], { opacity: 0 }, 0);
          tl.set("#mline", { scaleY: 0 }, 0);
          tl.fromTo("#bw", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.7, ease: E }, T6 + 0.15);
          // the salesperson shrinks into the Pixel dot in the page corner
          tl.to("#sales6", { x: 171, y: -557, scale: 0.18, duration: 0.85, ease: "power3.inOut", transformOrigin: "50% 50%" }, T6 + 0.3);
          tl.to("#sales6", { opacity: 0, duration: 0.2 }, T6 + 1.0);
          tl.fromTo("#px6", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(3)" }, T6 + 1.0);
          tl.fromTo("#s6lab", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.55, ease: E }, W(59) - 0.1);
          const blips = [W(62), W(65), W(68) + 0.15];
          blips.forEach((t) => { pulse("#px6", t, 1.5); ring("#px6r", t); });
          // the visit: product page …
          tl.fromTo("#cur6", { x: 980, y: 1200, opacity: 0 }, { opacity: 1, duration: 0.25 }, W(63) - 0.35);
          tl.to("#cur6", { x: 330, y: 760, duration: 0.6, ease: "power2.inOut" }, W(63) - 0.35);
          tl.set("#r6", { x: 330, y: 760 }, 0);
          ring("#r6", W(64));
          pulse("#j6", W(64), 1.05);
          tl.to("#mline", { scaleY: 1, duration: 0.6, ease: "power2.inOut" }, W(65));
          tl.fromTo("#m1", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, W(67) - 0.1);
          // … then the cart
          tl.to("#cur6", { x: 720, y: 892, duration: 0.5, ease: "power2.inOut" }, W(67) + 0.05);
          tl.set("#r6", { x: 720, y: 892 }, W(68) - 0.1);
          ring("#r6", W(68) - 0.05);
          tl.to("#cartbtn", { borderColor: ORANGE, color: ORANGE, duration: 0.2 }, W(68) - 0.05);
          tl.to("#pgA", { opacity: 0, duration: 0.25 }, W(68) + 0.1);
          tl.to("#pgB", { opacity: 1, duration: 0.3 }, W(68) + 0.15);
          tl.fromTo("#m2", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, W(70) - 0.1);
          tl.to("#cur6", { opacity: 0, duration: 0.3 }, W(70) + 0.2);
          out("#s6 > *", SC("s6")[1] - 0.35, 0.3);

          // ---------- 07 WARM ----------
          const T7 = SC("s7")[0];
          tl.set(["#pL", "#pR", "#lL", "#lR", "#s7z"], { opacity: 0 }, 0);
          tl.set(["#pathL", "#pathR"], { scaleY: 0 }, 0);
          tl.fromTo(".s7shop path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut", stagger: 0.12 }, T7 + 0.1);
          rise("#pL", W(72), 0.5, 20);
          tl.to("#pathL", { scaleY: 1, duration: 0.9, ease: "power2.inOut" }, W(72) + 0.3);
          rise("#lL", W(73), 0.45, 18);
          rise("#pR", W(77) - 0.15, 0.5, 20);
          tl.to("#pathR", { scaleY: 1, duration: 0.35, ease: "power2.out" }, W(77) + 0.15);
          rise("#lR", W(77), 0.45, 18);
          glow(W(77), 808, 760, 0.7, 0.5, 0.6);
          tl.fromTo("#s7z", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.55, ease: "expo.out" }, W(82) - 0.15);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s7")[1] - 0.6);
          out("#s7 > *", SC("s7")[1] - 0.35, 0.3);

          // ---------- 08 DON'T REPEAT ----------
          const deck = [];
          for (let k = 0; k < 5; k++) {
            const c = document.createElement("div");
            c.className = "jc";
            c.style.cssText = "left:350px;top:500px;width:380px;height:460px";
            c.innerHTML = JACKET.replace('<svg viewBox', '<svg style="left:15%;top:6%;width:70%;height:58%" viewBox') +
              '<i class="abs" style="left:44px;top:330px;width:220px;height:20px;border-radius:10px;background:#1A1A1A;opacity:0.85"></i>' +
              '<i class="abs" style="left:44px;top:366px;width:140px;height:20px;border-radius:10px;background:#1A1A1A;opacity:0.35"></i>' +
              '<i class="abs" style="left:236px;top:398px;width:100px;height:36px;border-radius:18px;background:#FF4D1A"></i>';
            $("#deck").appendChild(c);
            deck.push(c);
          }
          tl.set(["#s8t", "#s8eq", "#s8face"], { opacity: 0 }, 0);
          const dealt = [SC("s8")[0] + 0.25, W(87), W(88), W(90), W(91)];
          deck.forEach((c, k) => {
            const rot = k === 0 ? 0 : (k % 2 ? -1 : 1) * (2 + k);
            tl.fromTo(c, { opacity: 0, x: 520, y: -k * 26, rotation: 16 }, { opacity: 1 - k * 0.15, x: 0, rotation: rot, duration: 0.35, ease: "power3.out" }, dealt[k]);
          });
          tl.fromTo("#s8t", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, W(91) + 0.1);
          tl.fromTo(["#s8eq", "#s8face"], { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.1 }, W(92));
          tl.to("#s8face", { rotation: -8, duration: 0.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, W(93) + 0.2);
          tl.to(deck, { x: -900, rotation: -18, opacity: 0, duration: 0.5, ease: "power3.in", stagger: 0.03 }, We(93) + 0.05);
          out(["#s8t", "#s8eq", "#s8face"], SC("s8")[1] - 0.3, 0.25);

          // ---------- 09 THE RULES ----------
          tl.set([".rule", ".rc", "#rw2px"], { opacity: 0 }, 0);
          const ruleIn = (r, t) => tl.fromTo(r, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: E }, t);
          ruleIn("#rw1", W(94) - 0.05);
          tl.fromTo("#rw1 .rc", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, W(97) - 0.05);
          tl.fromTo("#rw1 .th", { opacity: 0.4, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, W(97));
          ruleIn("#rw2", W(101) - 0.05);
          tl.fromTo("#rw2 .rc", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, W(104) - 0.05);

          tl.fromTo("#rw3 .rc", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: E }, W(110) - 0.05);
          // bought → the ad switches off, the row turns gold
          const TG = W(110) + 0.15;

          tl.to(["#rw3 .ico", "#rw3 .rc"], { color: GOLD, borderColor: GOLD, duration: 0.4 }, TG);
          tl.to("#rw3 .th", { opacity: 0, scale: 0.85, duration: 0.5, ease: "power2.in" }, TG + 0.1);
          tl.to(["#rw1", "#rw2"], { opacity: 1, duration: 0.5 }, We(112) + 0.1);
          out(".rule", SC("s9")[1] - 0.35, 0.3);

          // ---------- 10 THE LINE ----------
          words($$(".a10"), W(113) - 0.05, 0.12);
          words($$(".b10"), W(118) - 0.05, 0.12);
          words($$(".c10"), W(122) - 0.05, 0.16, 40);
          words($$(".d10"), W(125) - 0.05, 0.14, 40);
          words($$(".e10"), W(127) - 0.05, 0.16, 40);
          glow(W(127), 400, 1090, 0.8, 0.6, 0.7);
          tl.fromTo("#s10in", { scale: 1 }, { scale: 1.05, duration: SC("s10")[1] - SC("s10")[0], ease: "sine.inOut", transformOrigin: "50% 50%" }, SC("s10")[0]);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s10")[1] - 0.6);
          out("#s10in", SC("s10")[1] - 0.35, 0.3);

          // ---------- 11 CTA ----------
          const T11 = SC("s11")[0];
          tl.set(["#w11", "#t11a", "#t11b", "#arr11"], { opacity: 0 }, 0);
          tl.fromTo("#bub11", { opacity: 0, scale: 0.8, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.8)", transformOrigin: "20% 90%" }, T11 + 0.2);
          rise("#w11", T11 + 0.45, 0.55, 26);
          tl.fromTo("#px11", { scale: 1, opacity: 0.6 }, { scale: 1.45, opacity: 1, duration: 0.45, yoyo: true, repeat: 7, ease: "sine.inOut" }, W(131) - 0.1);
          rise("#t11a", W(132) - 0.05, 0.55, 30);
          tl.fromTo("#arr11", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, W(133) + 0.2);
          tl.to("#arr11", { y: 16, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(133) + 0.6);
          rise("#t11b", W(135) - 0.05, 0.55, 24);
          glow(W(132), 540, 900, 0.6, 0.8, 0.7);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, END - 0.6);
          out("#s11 > *", END - 0.5, 0.4);

          // ---------- 12 END CARD ----------
          tl.fromTo("#s12logo", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, END + 0.1);

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
        else build();
      })();
    </script>

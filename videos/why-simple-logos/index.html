    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; src: url("assets/fonts/inter-latin-700-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1a1a; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: #1a1a1a; color: #f5f1ea; font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .clip { position: absolute; inset: 0; }

      /* ---- ground: designer's workspace ---- */
      #bg { background: #1a1a1a; overflow: hidden; }
      #bg-grid {
        position: absolute; left: 0; top: -180px; width: 1080px; height: 2280px;
        background-image:
          linear-gradient(to right, rgba(245,241,234,0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(245,241,234,0.035) 1px, transparent 1px);
        background-size: 90px 90px;
        background-position: 0 0;
      }
      #bg-vignette {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 80% 60% at 50% 48%, rgba(26,26,26,0) 40%, rgba(16,16,16,0.85) 100%);
      }
      .crop { position: absolute; width: 34px; height: 34px; border-color: rgba(245,241,234,0.22); border-style: solid; border-width: 0; }
      .crop.tl { left: 60px; top: 300px; border-left-width: 1.5px; border-top-width: 1.5px; }
      .crop.tr { right: 60px; top: 300px; border-right-width: 1.5px; border-top-width: 1.5px; }
      .crop.bl { left: 60px; bottom: 380px; border-left-width: 1.5px; border-bottom-width: 1.5px; }
      .crop.br { right: 60px; bottom: 380px; border-right-width: 1.5px; border-bottom-width: 1.5px; }
      .bg-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ff4d1a; opacity: 0.55; }

      /* ---- header row ---- */
      #hdr-wrap { position: absolute; left: 90px; right: 90px; top: 222px; height: 40px; }
      .hdr-lab {
        position: absolute; top: 0; font-weight: 700; font-size: 21px; letter-spacing: 0.24em;
        text-transform: uppercase; color: rgba(245,241,234,0.62); white-space: nowrap;
      }
      #hdr-l { left: 0; }
      #hdr-r { right: 0; color: rgba(245,241,234,0.56); font-weight: 500; }
      #hdr-sq { display: inline-block; width: 11px; height: 11px; background: #ff4d1a; margin-right: 14px; vertical-align: 1px; }
      #hdr-line { position: absolute; left: 0; right: 0; top: 46px; height: 2px; background: rgba(245,241,234,0.1); }
      #hdr-prog { position: absolute; left: 0; top: 46px; height: 2px; width: 900px; background: #ff4d1a; transform-origin: 0 50%; }
    </style>
  </head>
  <body>

      <!-- ground -->

    <script>
      const tl = gsap.timeline({ paused: true });
      // slow grid drift + header progress — the persistent "workspace" layer
      tl.fromTo("#bg-grid", { y: 0 }, { y: 180, duration: 106.5, ease: "none" }, 0);
      tl.fromTo("#bg-dot-a", { y: 0 }, { y: 120, duration: 106.5, ease: "none" }, 0);
      tl.fromTo("#bg-dot-b", { y: 0 }, { y: -140, duration: 106.5, ease: "none" }, 0);
      tl.fromTo("#hdr-wrap", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.05);
      tl.fromTo("#hdr-prog", { scaleX: 0 }, { scaleX: 1, duration: 96.1, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>

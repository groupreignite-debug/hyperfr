          tl.to("#phB", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.inOut" }, B.s6_wipe + 0.15);
          tl.fromTo("#wipe", { opacity: 1, x: 850 }, { x: 222, duration: 0.5, ease: "power2.inOut", immediateRender: false }, B.s6_wipe + 0.15);
          tl.to("#wipe", { opacity: 0, duration: 0.15 }, B.s6_wipe + 0.65);
          tl.set("#phA", { opacity: 0 }, B.s6_wipe + 0.66);
          tl.set("#term", { opacity: 1 }, B.s6_term - 0.01);
          tl.fromTo("#term", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, B.s6_term);
          glow(B.s6_term, 540, 330, 0.8, 0.5, 0.6);
          tl.to("#glow", { opacity: 0, duration: 0.6 }, B.s7_k[0]);

          // ---------- 07 ONE OF EACH ----------
          const LPALL = ["#lpWm", "#lpShoe", "#lpHead", "#lpSub", "#lpTicks", "#lpBtn"];
          const focus = (t, keep) => {
            LPALL.forEach((s) => tl.to(s, { opacity: keep.includes(s) ? 1 : 0.4, duration: 0.3 }, t));
          };
          const [k0, k1, k2, k3] = B.s7_k;
          focus(k0, []);
          tl.fromTo("#ghost", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, k0);
          rise("#hb0t", k0 + 0.15, 0.35, 10);
          focus(k1, ["#lpShoe"]);
          tl.to("#hb0t", { opacity: 0, duration: 0.2 }, k1);
          tl.to(["#ghost"], { opacity: 0.45, duration: 0.3 }, k1);
          tl.fromTo("#hb1", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, k1);
          rise("#hb1t", k1 + 0.1, 0.35, 10);
          focus(k2, ["#lpHead"]);
          tl.to("#hb1t", { opacity: 0, duration: 0.2 }, k2);
          tl.to(["#hb1"], { opacity: 0.45, duration: 0.3 }, k2);
          tl.fromTo("#hb2", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, k2);
          rise("#hb2t", k2 + 0.1, 0.35, 10);
          focus(k3, ["#lpBtn"]);
          tl.to("#hb2t", { opacity: 0, duration: 0.2 }, k3);
          tl.to(["#hb2"], { opacity: 0.45, duration: 0.3 }, k3);
          tl.fromTo("#hb3", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: E }, k3);
          rise("#hb3t", k3 + 0.1, 0.35, 10);
          tl.to("#phB", { scale: 1.05, transformOrigin: "50% 72%", duration: 0.8, ease: CAM }, k3);
          tl.fromTo("#lpBtn", { scale: 1 }, { scale: 0.95, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out" }, B.s7_tap);
          tl.fromTo("#rip", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.2, duration: 0.7, ease: "power2.out", immediateRender: false }, B.s7_tap);

          // ---------- 08 SIDE BY SIDE ----------
          const sp = B.s8_split;
          out("#term", sp, 0.3);
          tl.to(["#ghost", "#hb0t", "#hb1", "#hb1t", "#hb2", "#hb2t", "#hb3t"], { opacity: 0, duration: 0.3 }, sp);
          LPALL.forEach((s) => tl.to(s, { opacity: 1, duration: 0.3 }, sp));
          tl.to("#phB", { x: 300 - 540, y: 960 - 930, scale: SA, transformOrigin: "50% 50%", duration: 0.9, ease: CAM }, sp);
          tl.set("#phA", { x: 780 - 540 + 120, y: 30, scale: SA, transformOrigin: "50% 50%" }, sp + 0.05);
          tl.to("#phA", { opacity: 1, x: 780 - 540, duration: 0.8, ease: CAM }, sp + 0.1);
          // homepage: all its boxes and badges back (first screen of the page)
          tl.to([flashes[0], flashes[1], flashes[2], flashes[3]], { opacity: 0.85, duration: 0.3, stagger: 0.06 }, sp + 0.6);
          tl.to(dots.slice(0, 4).flat(), { opacity: 1, scale: 1, duration: 0.25, stagger: 0.03 }, sp + 0.7);
          $$(".b8").forEach((b, i) => pop(b, sp + 0.9 + i * 0.12, 0.3));
          tl.to("#phA", { x: 780 - 540 + 6, duration: 0.09, yoyo: true, repeat: 5, ease: "sine.inOut" }, B.s8_lab_a + 0.1);
          tl.fromTo("#lab8a", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, B.s8_lab_a);
          // the ad connects only to the landing page
          tl.fromTo("#ad3", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 0.42, duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, B.s8_ad);
          tl.set("#ad3", { scale: 0.3 }, 0);
          tl.set("#ln8", { opacity: 1 }, B.s8_line - 0.01);
          draw("#ln8p", B.s8_line, 0.55, 400);
          tl.fromTo("#ln8c", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, B.s8_line + 0.5);
          tl.to("#hb3", { opacity: 1, duration: 0.3 }, B.s8_line + 0.5);
          tl.fromTo("#lab8b", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, B.s8_lab_b);
          glow(B.s8_lab_b, 300, 960, 0.7, 0.7, 0.7);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, B.s9_in - 0.3);
          tl.to(["#phA", "#phB", "#ad3", "#ln8", "#lab8a", "#lab8b", "#bdgA"], { opacity: 0, duration: 0.4, ease: "power2.in" }, B.s9_in - 0.3);

          // ---------- 09 DINNER: the neighborhood ----------
          tl.set(".hs", { opacity: 0 }, 0);
          tl.set(".street", { opacity: 0 }, 0);
          tl.to(".street", { opacity: 1, duration: 0.6, stagger: 0.1 }, B.s9_in + 0.1);
          tl.to(".hs", { opacity: 1, duration: 0.45, stagger: { each: 0.05, from: "center" } }, B.s9_in + 0.15);
          $$(".hsw").forEach((p, i) => draw(p, B.s9_in + 0.15 + i * 0.05, 0.6, 520));
          // guest wanders the streets
          const G = (x, y) => ({ x: x - 32, y: y - 104 });
          const path = [G(60, 1000), G(250, 1000), G(250, 740), G(500, 740), G(500, 1000), G(730, 1000), G(730, 740), G(960, 740)];
          tl.set("#gw", { ...path[0], opacity: 0 }, 0);
          tl.set("#q9", { opacity: 0 }, 0);
          tl.to("#gw", { opacity: 1, duration: 0.4 }, B.s9_guest);
          const wStart = B.s9_guest + 0.3, wEnd = B.s10_light - 0.2;
          const seg = (wEnd - wStart) / (path.length - 1);
          path.slice(1).forEach((p, i) => tl.to("#gw", { x: p.x, y: p.y, duration: seg * 0.8, ease: "sine.inOut" }, wStart + i * seg));
          tl.fromTo("#guest", { rotation: -4 }, { rotation: 4, duration: 0.25, yoyo: true, repeat: Math.max(1, Math.floor((wEnd - wStart) / 0.25)), ease: "sine.inOut", transformOrigin: "50% 100%" }, wStart);
          tl.to("#q9", { opacity: 1, duration: 0.3 }, B.s9_wander);

          // ---------- 10 DOOR OPEN ----------
          const hc = { x: tgt.x + 80, y: tgt.y + 90 };
          tl.to("#q9", { opacity: 0, duration: 0.25 }, B.s10_light - 0.2);
          houses.forEach((h, i) => { if (i !== TGT) tl.to(`#hs${i}`, { opacity: 0.14, duration: 0.5 }, B.s10_light); });
          tl.to(`#hs${TGT} .hsw`, { fill: "rgba(255,77,26,0.22)", stroke: "#FF4D1A", strokeOpacity: 1, duration: 0.5 }, B.s10_light);
          glow(B.s10_light, hc.x, hc.y, 0.9, 0.55, 0.6);
          tl.to("#s9in", { x: 540 - hc.x, y: 930 - hc.y, scale: 1.9, transformOrigin: `${hc.x}px ${hc.y}px`, duration: 1.1, ease: CAM }, B.s10_light);
          tl.to("#glow", { x: 0, y: 930 - 960, duration: 1.1, ease: CAM }, B.s10_light);
          // guest waits at the door
          tl.to("#gw", { x: doorC.x - 32 - 70, y: doorC.y - 104, duration: 0.8, ease: "power2.inOut" }, B.s10_light - 0.1);
          tl.to("#guest", { rotation: 0, duration: 0.3 }, B.s10_light - 0.1);
          tl.set("#inside", { opacity: 1 }, B.s10_door - 0.01);
          tl.to("#door", { scaleX: 0.12, transformOrigin: "0% 0%", duration: 0.7, ease: "power2.out" }, B.s10_door);
          tl.to("#table", { opacity: 1, duration: 0.4 }, B.s10_table);
          tl.fromTo("#s10ic", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: E }, B.s10_table);
          tl.to("#gw", { x: doorC.x - 32, y: doorC.y - 104, scale: 0.6, opacity: 0, duration: 0.6, ease: "power2.in" }, B.s10_walk);
          tl.to(["#s9in", "#s10ic"], { opacity: 0, duration: 0.35 }, B.s11_in - 0.35);
          tl.to("#glow", { opacity: 0, duration: 0.35 }, B.s11_in - 0.35);

          // ---------- 11 THE RULE (gold, once) ----------
          tl.set(["#r0", ".rl"], { opacity: 0 }, 0);
          rise("#r0", B.s11_in + 0.1, 0.55, 24);
          const rl = $$(".rl"), rb = $$(".rb");
          tl.set(rb, { opacity: 0 }, 0);
          B.s11_stamp.forEach((t, i) => {
            rise(rl[i], t - 0.1, 0.5, 30);
            tl.fromTo(rb[i], { opacity: 0, scale: 2.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.32, ease: "power4.in" }, t + 0.25);
            tl.fromTo(rl[i], { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 3 }, t + 0.57);
          });
          tl.to("#s11 > *", { opacity: 0, duration: 0.3 }, B.s12_in - 0.3);

          // ---------- 12 CTA ----------
          tl.fromTo("#bub", { opacity: 0, scale: 0.85, transformOrigin: "20% 100%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, B.s12_in);
          pop("#cc1", B.s12_chips[0], 0.6);
          pop("#cc2", B.s12_chips[1], 0.6);
          tl.fromTo("#dn", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, B.s12_arrow);
          tl.to("#dn", { y: 22, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, B.s12_arrow + 0.4);
          tl.to("#s12 > *", { opacity: 0, duration: 0.4, ease: "power2.in" }, B.end - 0.45);

          // ---------- 13 END CARD ----------
          tl.fromTo("#endlogo", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, B.end);

          // ---------- subtitles ----------
          SUBS.forEach((s, i) => {
            const el = `#sub${i}`;
            tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, s.s);
            tl.to(el, { opacity: 0, duration: 0.12 }, s.e - 0.12);
          });

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        build();
      }
      // fonts first: the mockups are measured (button / tile positions) before the timeline is built
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(main);
      else main();
    </script>
  </body>
</html>

      @font-face { font-family: "Alexandria"; font-weight: 900; src: url("assets/fonts/alexandria-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 300; src: url("assets/fonts/alexandria-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 400; src: url("assets/fonts/alexandria-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 500; src: url("assets/fonts/alexandria-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 700; src: url("assets/fonts/alexandria-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 800; src: url("assets/fonts/alexandria-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 900; src: url("assets/fonts/alexandria-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }

      :root {
        --orange: #ff4d1a;
        --charcoal: #1a1a1a;
        --paper: #f5f1ea;
        --gold: #ffb000;
        --paper-70: rgba(245, 241, 234, 0.7);
        --paper-55: rgba(245, 241, 234, 0.55);
        --paper-14: rgba(245, 241, 234, 0.14);
        --paper-08: rgba(245, 241, 234, 0.08);
        --muted: #6e6a64;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--charcoal); }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: var(--charcoal); color: var(--paper);
        font-family: "Alexandria", sans-serif; -webkit-font-smoothing: antialiased;
      }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .row { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
      .ar { direction: rtl; unicode-bidi: isolate; }
      .en { direction: ltr; unicode-bidi: isolate; }
      .w { display: inline-block; }
      .or { color: var(--orange); }
      .caps { font-weight: 800; letter-spacing: 0.02em; }

      /* ---------- ground ---------- */
      #ground { overflow: hidden; }
      #grid {
        position: absolute; left: -144px; top: -144px; width: 1368px; height: 2208px;
        background-image:
          linear-gradient(rgba(245, 241, 234, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 241, 234, 0.035) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      #marks { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #marks path { stroke: rgba(245, 241, 234, 0.09); stroke-width: 1.5; fill: none; }
      #glow {
        position: absolute; left: 90px; top: 510px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 77, 26, 0.22), rgba(255, 77, 26, 0.07) 55%, rgba(255, 77, 26, 0) 100%);
        opacity: 0;
      }
      #prog { position: absolute; left: 90px; right: 90px; top: 236px; height: 2px; background: var(--paper-08); }
      #progfill { position: absolute; inset: 0; background: var(--orange); transform-origin: 0 50%; }
      #vig {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 75% at 50% 48%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.38) 100%);
      }

      /* ---------- shared pieces ---------- */
      .person { position: absolute; display: block; }
      .person svg { width: 100%; height: 100%; display: block; fill: currentColor; }
      [data-ic] { display: block; width: 44px; height: 44px; flex: none; }
      .ic { display: block; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .chip {
        display: flex; align-items: center; gap: 16px; height: 92px; padding: 0 36px; border-radius: 46px;
        border: 2px solid var(--paper-14); background: rgba(245, 241, 234, 0.04); font-size: 46px; font-weight: 700;
        direction: rtl; white-space: nowrap;
      }
      .chip.ico { padding: 0 28px; }
      .chip [data-ic] { width: 50px; height: 50px; }
      .chips { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 22px; direction: rtl; }
      .dot { font-size: 46px; color: var(--paper-55); }
      .badge { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--charcoal); }
      .logo-frame { position: absolute; overflow: hidden; }
      .logo-frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .logo-clip { mix-blend-mode: lighten; }
      .draw path, .draw rect, .draw circle { fill: none; stroke: var(--paper-55); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .q { position: absolute; color: var(--orange); font-weight: 900; text-align: center; direction: rtl; line-height: 1; -webkit-text-stroke: 12px var(--charcoal); paint-order: stroke fill; }

      /* the two versions: A = off-white outline card, B = solid orange card (same pairing in every scene) */
      .vA { border: 6px solid var(--paper); background: rgba(245, 241, 234, 0.03); color: var(--paper); }
      .vB { border: 6px solid var(--orange); background: var(--orange); color: var(--charcoal); }
      .fly { position: absolute; border-radius: 30px; overflow: hidden; }
      .lt { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; line-height: 1; direction: ltr; }
      .fly .tx { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; direction: rtl; line-height: 1.3; }
      .mini { position: absolute; border-radius: 6px; }
      .mini.vA { border-width: 3px; background: var(--charcoal); }
      .mini.vB { border-width: 3px; }
      .lb { position: absolute; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900; direction: ltr; }
      .half { display: flex; align-items: center; gap: 14px; direction: ltr; font-size: 72px; font-weight: 800; color: var(--paper); }
      .half .lb { position: relative; width: 84px; height: 84px; font-size: 50px; }

      /* neutral ad card (scenes 01 and 09) */
      .adc { position: absolute; border-radius: 28px; border: 4px solid var(--paper-14); background: #202020; }
      .adc .av { position: absolute; left: 28px; top: 26px; width: 52px; height: 52px; border-radius: 50%; background: var(--paper-14); }
      .adc .hb { position: absolute; left: 96px; top: 40px; width: 150px; height: 22px; border-radius: 11px; background: var(--paper-14); }
      .adc .im { position: absolute; left: 28px; top: 100px; right: 28px; height: 220px; border-radius: 18px; background: var(--paper-08); }
      .adc .t1 { position: absolute; left: 28px; top: 346px; width: 260px; height: 24px; border-radius: 12px; background: var(--paper-14); }
      .adc .t2 { position: absolute; left: 28px; top: 386px; width: 180px; height: 24px; border-radius: 12px; background: var(--paper-08); }
      .adc .bt { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 52px; border-radius: 26px; background: var(--paper-14); }

      /* scene 09: the ad with three parts */
      .part { position: absolute; left: 30px; right: 30px; border-radius: 18px; }
      .lay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .hbar { position: absolute; height: 30px; border-radius: 15px; }
      .plabel { position: absolute; left: 812px; display: flex; align-items: center; gap: 12px; height: 76px; padding: 0 24px; border-radius: 38px; border: 2px solid var(--paper-14); background: rgba(245, 241, 234, 0.04); font-size: 42px; font-weight: 700; direction: rtl; white-space: nowrap; }
      .plabel [data-ic] { width: 40px; height: 40px; color: var(--orange); }

      /* scene 11-12: generic social ad cards */
      .sad { position: absolute; border-radius: 30px; overflow: hidden; }
      .sad .av { position: absolute; left: 26px; top: 24px; width: 50px; height: 50px; border-radius: 50%; }
      .sad .hb { position: absolute; left: 92px; top: 38px; width: 140px; height: 22px; border-radius: 11px; }
      .sad .im { position: absolute; left: 26px; right: 26px; top: 96px; height: 250px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
      .sad .h1b { position: absolute; left: 26px; top: 372px; width: 270px; height: 26px; border-radius: 13px; }
      .sad .h2b { position: absolute; left: 26px; top: 412px; width: 190px; height: 26px; border-radius: 13px; }
      .sad .bt { position: absolute; left: 26px; right: 26px; bottom: 24px; height: 56px; border-radius: 28px; }
      .sad.vA .av, .sad.vA .hb, .sad.vA .h1b, .sad.vA .bt { background: rgba(245, 241, 234, 0.22); }
      .sad.vA .h2b { background: rgba(245, 241, 234, 0.12); }
      .sad.vA .im { background: rgba(245, 241, 234, 0.08); color: var(--paper); }
      .sad.vB .av, .sad.vB .hb, .sad.vB .h1b, .sad.vB .bt { background: rgba(26, 26, 26, 0.32); }
      .sad.vB .h2b { background: rgba(26, 26, 26, 0.2); }
      .sad.vB .im { background: var(--charcoal); color: var(--orange); }
      .sad .lt { top: 170px; font-size: 220px; }

      /* subtitles: one line at a time, bottom safe area (above the bottom 300px, clear of the right-edge icons) */
      #subs { pointer-events: none; }
      .sub { position: absolute; left: 90px; width: 840px; top: 1430px; height: 190px; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .sub span {
        display: inline-block; max-width: 840px; padding: 14px 32px; border-radius: 24px;
        background: rgba(26, 26, 26, 0.86); border: 1px solid rgba(245, 241, 234, 0.1);
        font-size: 46px; font-weight: 600; line-height: 1.45; text-align: center; color: var(--paper);
        direction: rtl; unicode-bidi: isolate; white-space: normal; text-wrap: balance;
      }
      .sub b { font-weight: 700; color: var(--orange); direction: ltr; unicode-bidi: isolate; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0.0" data-duration="65.096" data-width="1080" data-height="1920">

      <!-- ================= GROUND (grid, marks, travelling glow, progress) ================= -->
      <div id="ground" class="clip" data-start="0.0" data-duration="65.096" data-track-index="0">
        <div id="grid" data-layout-allow-overflow></div>
        <svg id="marks" viewBox="0 0 1080 1920">

          tag: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
          hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11.5V4a1.5 1.5 0 0 1 3 0v7.5"/><path d="M14 11.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 10a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1.2a7 7 0 0 1-5.4-2.6L3.3 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15.6"/>',
          hourglass: '<path d="M6 2.5h12M6 21.5h12"/><path d="M7.5 2.5v3a4.5 4.5 0 0 0 2.2 3.9L12 12l2.3-2.6a4.5 4.5 0 0 0 2.2-3.9v-3"/><path d="M7.5 21.5v-3a4.5 4.5 0 0 1 2.2-3.9L12 12l2.3 2.6a4.5 4.5 0 0 1 2.2 3.9v3"/>',
          heart: '<path d="M12 20.5s-8-4.7-8-11a4.5 4.5 0 0 1 8-2.8 4.5 4.5 0 0 1 8 2.8c0 6.3-8 11-8 11Z"/>',
          chart: '<path d="M3 21h18"/><path d="M6.5 21v-7M11 21V9M15.5 21v-5M20 21V5"/>',
          image: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
        };
        const PERSON = '<svg viewBox="0 0 60 100"><circle cx="30" cy="16" r="14"/><path d="M5 98 V64 Q5 38 30 38 Q55 38 55 64 V98 Z"/></svg>';
        const mk = (host, cls, css, html = "") => {
          const d = document.createElement("div");
          d.className = cls;
          d.style.cssText = css;
          d.innerHTML = html;
          host.appendChild(d);
          return d;
        };

        function build() {
          // ---------- generated pieces (deterministic) ----------
          // scene 03: a crowd row under the two cards
          const crowd3 = $("#crowd3");
          for (let k = 0; k < 9; k++) mk(crowd3, "person p3", `left:${238 + k * 68}px;top:0;width:52px;height:86px;color:rgba(245,241,234,0.7)`, PERSON);
          // scene 06: a crowd on the street, each person gets a mini flyer (right half A, left half B)
          const crowd6 = $("#crowd6");
          for (let k = 0; k < 10; k++) {
            const x = 128 + k * 86 + (k >= 5 ? 24 : 0);
            const g = mk(crowd6, "abs g6", `left:${x}px;top:960px;width:64px;height:220px`);
            mk(g, "person", "left:2px;top:112px;width:60px;height:106px;color:rgba(245,241,234,0.7)", PERSON);
            mk(g, `mini ${x > 540 ? "vA m6a" : "vB m6b"}`, "left:12px;top:40px;width:40px;height:54px");
          }
          // scene 07: walkers into the shop, each carrying a flyer; the two piles of returned flyers
          const walk7 = $("#walk7");
          ["vB", "vA", "vB", "vB", "vA", "vB"].forEach((v, k) => {
            const g = mk(walk7, "abs w7", "left:900px;top:960px;width:64px;height:220px");
            mk(g, "person", "left:2px;top:112px;width:60px;height:106px;color:rgba(245,241,234,0.7)", PERSON);
            mk(g, `mini ${v}`, "left:12px;top:40px;width:40px;height:54px");
          });
          const sheets = (host, v, n) => { for (let k = 0; k < n; k++) mk(host, `mini ${v} sh`, `left:${(k % 2) * 4}px;top:${184 - k * 20}px;width:92px;height:16px;border-radius:4px`); };
          sheets($("#pileA"), "vA", 3);
          sheets($("#pileB"), "vB", 8);
          // scene 10: calendar pages (dots, no numbers) and the growing crowd
          $$(".calp").forEach((p) => {
            p.style.cssText = "left:0;right:0;top:70px;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 40px;background:#202020";
            for (let k = 0; k < +p.dataset.n; k++) mk(p, "", "width:26px;height:26px;border-radius:50%;background:#F5F1EA");
          });
          const crowd10 = $("#crowd10");
          for (let r = 0; r < 3; r++) for (let k = 0; k < 11; k++) mk(crowd10, `person c10r${r}`, `left:${112 + k * 78 + (r % 2) * 20}px;top:${1000 + r * 104}px;width:46px;height:78px;color:rgba(245,241,234,${0.7 - r * 0.15})`, PERSON);
          // scene 11: one audience group under both cards
          const aud = $("#aud11");
          for (let k = 0; k < 11; k++) mk(aud, "person a11", `left:${150 + k * 74}px;top:1110px;width:50px;height:84px;color:rgba(245,241,234,0.7)`, PERSON);

          $$("[data-ic]").forEach((el) => { el.innerHTML = `<svg class="ic" viewBox="0 0 24 24" style="width:100%;height:100%">${ICON[el.dataset.ic]}</svg>`; });

          const tl = gsap.timeline({ paused: true });
          const DUR = CUES.duration, END = CUES.endcard;
          const rise = (el, t, d = 0.7, y = 44) => tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: E }, t);
          const out = (el, t, d = 0.35) => tl.to(el, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const pop = (el, t, d = 0.5) => tl.fromTo(el, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(2.2)" }, t);
          const pulse = (el, t, s = 1.08) => tl.fromTo(el, { scale: 1 }, { scale: s, duration: 0.16, yoyo: true, repeat: 1, ease: "power2.out" }, t);
          const glow = (t, x, y, op, s = 1, d = 0.8) => tl.to("#glow", { x: x - 540, y: y - 960, opacity: op, scale: s, duration: d, ease: "power2.inOut" }, t);
          const chipIn = (el, t) => tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, t);
          const bob = (el, t, d) => tl.fromTo(el, { y: 0 }, { y: -8, duration: 0.14, yoyo: true, repeat: Math.max(1, Math.round(d / 0.14) - 1), ease: "sine.inOut" }, t);

          // ---------- ground ----------
          tl.fromTo("#grid", { x: 0, y: 0 }, { x: 72, y: 144, duration: DUR, ease: "none" }, 0);
          tl.fromTo("#marks", { opacity: 0 }, { opacity: 1, duration: 1.2 }, 0.2);
          tl.fromTo("#progfill", { scaleX: 0 }, { scaleX: 1, duration: END - 0.4, ease: "none" }, 0.4);
          tl.to(["#grid", "#marks", "#prog"], { opacity: 0, duration: 0.8, ease: "power1.inOut" }, END - 0.4);

          // ---------- subtitles ----------
          const host = $("#subs");
          SUBS.forEach(([wi, html], i) => {
            const d = mk(host, "sub", "", `<span>${html}</span>`);
            const t = W(wi);
            const next = i + 1 < SUBS.length ? W(SUBS[i + 1][0]) : END;
            const sameLine = i + 1 < SUBS.length && lineEndFor(SUBS[i + 1][0]) === lineEndFor(wi);
            const hide = sameLine ? next - 0.18 : Math.min(lineEndFor(wi) + 0.45, next - 0.18);
            tl.fromTo(d, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, t - 0.06);
            tl.to(d, { opacity: 0, duration: 0.12, ease: "none" }, hide);
          });

          // ---------- 01 HOOK ----------
          tl.fromTo("#s1logo", { opacity: 0 }, { opacity: 0.9, duration: 0.8, ease: "power1.out" }, 0.05);
          tl.to("#s1logo", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, We(10) + 0.05);
          tl.set(["#x1", "#up1", "#ad2", "#q1"], { opacity: 0 }, 0);
          rise("#ad1", 0.1, 0.7, 60);
          // the first ad: ✗ (didn't work)
          tl.fromTo("#x1", { opacity: 0, scale: 1.8, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: "expo.out" }, W(3) - 0.05);
          pulse("#ad1", W(3) + 0.1, 0.97);
          // a second ad replaces it: ↗ (a bit better)
          tl.to("#ad1", { x: 240, scale: 0.72, opacity: 0.45, duration: 0.6, ease: "power3.inOut" }, W(4) - 0.15);
          tl.fromTo("#ad2", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: E }, W(4) - 0.05);
          pop("#up1", W(7) - 0.05, 0.4);
          // both freeze side by side, a big ؟ lands between them
          tl.to("#ad2", { x: -240, scale: 0.72, duration: 0.55, ease: "power3.inOut" }, W(9) - 0.2);
          tl.to("#ad1", { opacity: 1, duration: 0.4 }, W(9) - 0.2);
          tl.fromTo("#q1", { opacity: 0, scale: 1.7, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, W(10) - 0.05);
          glow(W(10), 540, 860, 0.5, 0.6, 0.4);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s1")[1] - 0.4);
          out(["#ad1", "#ad2", "#q1"], SC("s1")[1] - 0.3, 0.25);

          // ---------- 02 GUESSING ----------
          tl.set(["#fold2", "#dart2", "#c2"], { opacity: 0 }, 0);
          tl.fromTo("#board2 .dp", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut", stagger: 0.06 }, SC("s2")[0] + 0.05);
          tl.fromTo("#fold2", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: E }, W(12) - 0.1);
          // the dart flies … and misses the board (lands off it, upper right)
          const DART = W(13) - 0.05;
          tl.set("#dart2", { opacity: 1, rotation: -18, transformOrigin: "100% 50%" }, DART);
          tl.fromTo("#dart2", { x: 0, y: 0 }, { x: 470, y: -170, duration: 0.42, ease: "power1.in" }, DART);
          tl.fromTo("#dart2", { rotation: -18 }, { rotation: -12, duration: 0.08, yoyo: true, repeat: 3, ease: "sine.inOut" }, DART + 0.42);
          chipIn("#c2", W(15) - 0.1);
          out(["#board2", "#fold2", "#dart2", "#c2"], SC("s2")[1] - 0.3, 0.25);

          // ---------- 03 TERM ----------
          tl.set(["#t3", "#cA3", "#cB3", "#ok3", ".p3", "#c3"], { opacity: 0 }, 0);
          tl.set("#div3", { scaleY: 0 }, 0);
          tl.fromTo("#t3", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "expo.out" }, W(18) - 0.08);
          glow(W(18), 540, 450, 0.55, 0.8, 0.6);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, W(20));
          // the screen splits: A slides in on the right, B on the left
          tl.to("#div3", { scaleY: 1, duration: 0.5, ease: "power2.inOut" }, W(21) - 0.15);
          tl.fromTo("#cA3", { opacity: 0, x: 260 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, W(22) - 0.1);
          tl.fromTo("#cB3", { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.6, ease: E }, W(22) + 0.05);
          // people drop in under them … and pick one
          tl.fromTo(".p3", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)", stagger: 0.08 }, W(27) - 0.1);
          chipIn("#c3", W(29) - 0.1);
          pop("#ok3", W(31) - 0.05, 0.45);
          pulse("#cB3", W(31) + 0.1, 1.04);
          out(["#t3", "#div3", "#cA3", "#cB3", "#ok3", ".p3", "#c3"], SC("s3")[1] - 0.35, 0.3);

          // ---------- the juice shop (04-07) ----------
          const T4 = SC("shop")[0];
          tl.set(["#sign4", "#juicer", "#oranges", "#stack", "#c4", "#pileA", "#pileB", "#lbA7", "#lbB7", ".sh"], { opacity: 0 }, 0);
          tl.fromTo("#shopDraw .sp", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut", stagger: 0.09 }, T4 + 0.1);
          tl.to("#sign4", { opacity: 1, duration: 0.4 }, W(33));
          chipIn("#c4", W(34) - 0.05);
          rise("#juicer", W(35) - 0.1, 0.45, 16);
          rise("#oranges", W(35) + 0.05, 0.45, 16);
          tl.fromTo("#stack", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, W(38) - 0.05);
          out("#c4", SC("s4")[1] - 0.3, 0.25);

          // ---------- 05 THE FLYERS: two flyers fly out of the stack ----------
          tl.set(["#flyA", "#flyB", "#txA", "#txB", "#icB"], { opacity: 0 }, 0);
          tl.to("#shopDraw, #sign4, #juicer, #oranges", { opacity: 0.12, duration: 0.5 }, W(42) - 0.2);
          const FLY = (el, t, x, rot) => {
            tl.set(el, { opacity: 1 }, t);
            tl.fromTo(el, { x, y: 180, scale: 0.12, rotation: rot }, { x: 0, y: 0, scale: 1, rotation: 0, duration: 0.7, ease: "power3.out" }, t);
          };
          FLY("#flyA", W(42) - 0.2, -185, 25);
          tl.to("#txA", { opacity: 1, duration: 0.4 }, W(45) - 0.1);
          FLY("#flyB", W(47) - 0.1, 275, -25);
          tl.to("#icB", { opacity: 1, duration: 0.4 }, W(48));
          tl.to("#txB", { opacity: 1, duration: 0.4 }, W(49) - 0.1);
          tl.to("#stack", { opacity: 0, duration: 0.3 }, W(47));
          out(["#flyA", "#flyB"], SC("s5")[1] - 0.3, 0.25);
          tl.to("#shopDraw, #sign4, #juicer, #oranges", { opacity: 0, duration: 0.3 }, SC("s5")[1] - 0.3);

          // ---------- 06 SPLIT: half get A, half get B ----------
          const T6 = SC("s6")[0];
          tl.set(["#hA6", "#hB6", ".m6a", ".m6b"], { opacity: 0 }, 0);
          tl.set("#split6", { scaleY: 0 }, 0);
          tl.fromTo("#street6", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, T6);
          tl.fromTo(".g6", { opacity: 0, x: 380 }, { opacity: 1, x: 0, duration: 0.75, ease: "power2.out", stagger: 0.03 }, T6);
          bob(".g6 .person", T6, 0.75);
          tl.to("#split6", { scaleY: 1, duration: 0.4, ease: "power2.inOut" }, W(52) + 0.05);
          tl.fromTo(".m6a", { opacity: 0, y: 30, rotation: -20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.07 }, W(53) - 0.05);
          pop("#hA6", W(54), 0.4);
          tl.fromTo(".m6b", { opacity: 0, y: 30, rotation: 20 }, { opacity: 1, y: 0, rotation: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.07 }, W(56) - 0.05);
          pop("#hB6", W(57), 0.4);
          out(["#street6", "#split6", "#crowd6", "#hA6", "#hB6"], SC("s6")[1] - 0.25, 0.2);

          // ---------- 07 COUNT: people bring their flyers back, two piles grow (no numbers) ----------
          const T7 = SC("s7")[0];
          tl.set("#c7", { opacity: 0 }, 0);
          tl.to("#shopDraw, #sign4", { opacity: 1, duration: 0.3 }, T7 - 0.1);
          tl.set(["#pileA", "#pileB", "#lbA7", "#lbB7"], { opacity: 1 }, T7);
          tl.fromTo(["#lbA7", "#lbB7"], { scale: 0.5 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, T7);
          const walkers = $$(".w7");
          tl.set(walkers, { opacity: 0 }, 0);
          walkers.forEach((g, k) => {
            const t = T7 + 0.05 + k * 0.24;
            tl.fromTo(g, { opacity: 0, x: 120 }, { opacity: 1, x: -150, duration: 0.45, ease: "power1.out" }, t);
            tl.to(g, { opacity: 0, duration: 0.12 }, t + 0.42);
          });
          const shA = $$("#pileA .sh"), shB = $$("#pileB .sh");
          shB.forEach((s, k) => tl.fromTo(s, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, T7 + 0.35 + k * 0.17));
          shA.forEach((s, k) => tl.fromTo(s, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, T7 + 0.6 + k * 0.4));
          chipIn("#c7", W(62) - 0.1);
          out(["#shopDraw", "#sign4", "#pileA", "#pileB", "#lbA7", "#lbB7", "#c7"], SC("s7")[1] - 0.25, 0.25);

          // ---------- 08 NUMBERS TALK ----------
          const n1 = $$(".n1"), n2 = $$(".n2");
          [W(65), W(67), W(68), W(69)].forEach((t, i) => rise(n1[i], t - 0.08, 0.5, 30));
          [W(70), W(71), W(72)].forEach((t, i) => rise(n2[i], t - 0.08, 0.5, 30));
          glow(W(70), 540, 960, 0.55, 0.9, 0.5);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s8")[1] - 0.4);
          out("#s8 .row", SC("s8")[1] - 0.3, 0.25);

          // ---------- 09 ONE THING ----------
          tl.set(["#ad9", "#ok9", "#i2", "#h2", "#p2", "#qI", "#qH", "#qP", ".plabel", ".lck"], { opacity: 0 }, 0);
          tl.fromTo("#r9", { opacity: 0 }, { opacity: 0.25, duration: 0.3 }, W(75) - 0.1);
          // the rule stamps in
          tl.fromTo("#r9", { opacity: 0.25, scale: 2.2, rotation: 0 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.28, ease: "power4.in" }, W(79) - 0.28);
          tl.fromTo("#r9", { x: 0 }, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, W(79));
          glow(W(79), 540, 620, 0.55, 0.6, 0.3);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, W(80) + 0.3);
          // it moves up out of the way; the ad with its three parts appears
          tl.to("#r9", { y: -200, scale: 0.5, duration: 0.6, ease: "power3.inOut" }, W(81) - 0.25);
          rise("#ad9", W(81) - 0.1, 0.55, 40);
          [["#lI", "#pI", W(83)], ["#lH", "#pH", W(84)], ["#lP", "#pP", W(85)]].forEach(([l, p, t]) => {
            tl.fromTo(l, { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.35, ease: E }, t - 0.1);
            pulse(p, t, 1.04);
          });
          // all three swap at once (fast blur) … it worked … but which one?
          const SW = W(86) - 0.05;
          const swap = (a, b, t, on) => {
            tl.to(a, { opacity: on ? 0 : 1, filter: "blur(14px)", duration: 0.14, ease: "power1.in" }, t);
            tl.fromTo(b, { opacity: on ? 0 : 1, filter: "blur(14px)" }, { opacity: on ? 1 : 0, filter: "blur(0px)", duration: 0.22, ease: "power1.out" }, t + 0.1);
            tl.set(a, { filter: "blur(0px)" }, t + 0.32);
          };
          [["#i1", "#i2"], ["#h1", "#h2"], ["#p1", "#p2"]].forEach(([a, b]) => swap(a, b, SW, true));
          tl.fromTo("#ad9", { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, SW);
          pop("#ok9", W(87) - 0.05, 0.4);
          ["#qI", "#qH", "#qP"].forEach((q, k) => pop(q, W(88) - 0.1 + k * 0.12, 0.35));
          // reset … then only the image swaps: one clear arrow at it
          const RS = W(92) - 0.1;
          out(["#qI", "#qH", "#qP", "#ok9"], RS, 0.2);
          [["#i2", "#i1"], ["#h2", "#h1"], ["#p2", "#p1"]].forEach(([a, b]) => {
            tl.to(a, { opacity: 0, duration: 0.2 }, RS);
            tl.to(b, { opacity: 1, duration: 0.2 }, RS);
          });
          swap("#i1", "#i2", RS + 0.3, true);
          tl.to(["#lH", "#lP"], { opacity: 0.35, duration: 0.3 }, RS + 0.3);
          tl.to("#lI", { borderColor: ORANGE, backgroundColor: "rgba(255,77,26,0.12)", duration: 0.3 }, RS + 0.35);
          tl.fromTo(".lck", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, RS + 0.35);
          tl.fromTo("#lI", { x: 0 }, { x: -12, duration: 0.18, yoyo: true, repeat: 3, ease: "sine.inOut" }, RS + 0.45);
          out(["#r9", "#ad9", ".plabel"], SC("s9")[1] - 0.3, 0.25);

          // ---------- 10 TIME ----------
          const T10 = SC("s10")[0];
          const calp = $$(".calp");
          tl.set(["#hand10", "#c10a", "#c10b", "#c10c", "#d10a", "#d10b", "#crowd10 .person"], { opacity: 0 }, 0);
          tl.set(calp, { opacity: 0 }, 0);
          rise("#cal10", T10 + 0.05, 0.5, 30);
          tl.set(calp[0], { opacity: 1 }, T10);
          // ✋ don't judge on day one
          tl.fromTo("#hand10", { opacity: 0, scale: 0.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2)" }, W(95) - 0.05);
          tl.fromTo("#hand10", { rotation: 0 }, { rotation: 8, duration: 0.12, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(95) + 0.45);
          chipIn("#c10a", W(97) - 0.1);
          // the pages flip forward a few days
          tl.to("#hand10", { opacity: 0, scale: 0.8, duration: 0.3 }, W(99) - 0.15);
          [1, 2, 3, 4].forEach((k) => tl.fromTo(calp[k], { opacity: 0, scaleY: 0.2, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.22, ease: "power2.out" }, W(99) + (k - 1) * 0.3));
          tl.to("#d10a", { opacity: 1, duration: 0.3 }, W(100) - 0.1);
          chipIn("#c10b", W(100) - 0.05);
          // … while the crowd grows
          tl.fromTo(".c10r0", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: E, stagger: 0.03 }, W(103) - 0.1);
          tl.fromTo(".c10r1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: E, stagger: 0.03 }, W(105) - 0.1);
          tl.fromTo(".c10r2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: E, stagger: 0.03 }, W(107) - 0.1);
          tl.to("#d10b", { opacity: 1, duration: 0.3 }, W(103) - 0.1);
          chipIn("#c10c", W(103) - 0.05);
          out(["#cal10", "#c10a", "#c10b", "#c10c", "#d10a", "#d10b", "#crowd10"], SC("s10")[1] - 0.3, 0.25);

          // ---------- 11 IN ADS: the flyers become two ad cards ----------
          const T11 = SC("pair")[0];
          tl.set(["#win12", "#heart12", "#gok12", "#barA", "#barB", "#base12", ".a11", "#c11a", "#c11b", "#c11c", "#d11", ".adin"], { opacity: 0 }, 0);
          tl.fromTo(["#sA", "#sB"], { opacity: 0, scale: 0.6, y: 60 }, { opacity: 1, scale: 0.78, y: 0, duration: 0.6, ease: E, stagger: 0.12 }, T11 + 0.05);
          // morph: the letter goes, the ad's parts come in, the card grows to an ad
          const MO = W(109) - 0.1;
          tl.to(".flt", { opacity: 0, scale: 0.6, duration: 0.3, ease: "power2.in" }, MO);
          tl.to(["#sA", "#sB"], { scale: 1, duration: 0.6, ease: "power3.inOut" }, MO);
          tl.fromTo(".adin", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, MO + 0.25);
          chipIn("#c11a", W(111) - 0.05);
          tl.to("#d11", { opacity: 1, duration: 0.3 }, W(113) - 0.1);
          chipIn("#c11b", W(113) - 0.05);
          pulse("#sA .im", W(113) + 0.1, 1.06);
          pulse("#sB .im", W(114), 1.06);
          tl.fromTo(".a11", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)", stagger: 0.05 }, W(115) - 0.1);
          chipIn("#c11c", W(116) - 0.05);
          out(["#c11a", "#c11b", "#c11c", "#d11", ".a11"], SC("s11")[1] - 0.3, 0.25);

          // ---------- 12 THE WINNER ----------
          tl.set(["#c12a", "#c12b"], { opacity: 0 }, 0);
          pop("#heart12", W(121) - 0.1, 0.45);
          chipIn("#c12a", W(122) - 0.1);
          tl.to("#base12", { opacity: 1, duration: 0.3 }, W(124));
          tl.set(["#barA", "#barB"], { opacity: 1 }, W(125) - 0.1);
          tl.fromTo("#barA", { scaleY: 0 }, { scaleY: 0.3, duration: 0.6, ease: "power2.out" }, W(125) - 0.1);
          tl.fromTo("#barB", { scaleY: 0 }, { scaleY: 1, duration: 1.1, ease: "power2.out" }, W(125) - 0.1);
          chipIn("#c12b", W(125) - 0.05);
          // B wins: gold outline + check; the heart fades
          tl.fromTo("#win12", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.45, ease: E }, W(128) - 0.05);
          pop("#gok12", W(128), 0.45);
          tl.to(["#heart12", "#c12a"], { opacity: 0.25, duration: 0.5 }, W(128) + 0.2);
          tl.to("#sA", { opacity: 0.5, duration: 0.5 }, W(128) + 0.2);
          glow(W(128), 310, 800, 0.5, 0.7, 0.5);
          tl.to("#glow", { opacity: 0, duration: 0.4 }, SC("s12")[1] - 0.4);
          out(["#pair > *", "#c12a", "#c12b"], SC("s12")[1] - 0.35, 0.3);

          // ---------- 13 CTA ----------
          const T13 = SC("s13")[0];
          const K = ["#k1", "#k2", "#k3"];
          tl.set([...K, "#arr13"], { opacity: 0 }, 0);
          tl.fromTo("#bub13", { opacity: 0, scale: 0.85, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.6)", transformOrigin: "20% 90%" }, T13 + 0.15);
          K.forEach((k, i) => tl.fromTo(k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, W(131) + i * 0.15));
          // the chips light up as they're named, like a tap
          [W(137), W(138), W(140)].forEach((t, i) => tl.to(K[i], { borderColor: ORANGE, backgroundColor: "rgba(255,77,26,0.14)", duration: 0.2, yoyo: true, repeat: 1, repeatDelay: 0.25, ease: "power1.inOut" }, t - 0.05));
          tl.fromTo("#arr13", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: E }, W(141) - 0.05);
          tl.to("#arr13", { y: 18, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(141) + 0.35);
          glow(W(131), 540, 760, 0.5, 0.9, 0.7);
          tl.to("#glow", { opacity: 0, duration: 0.5 }, END - 0.6);
          out("#s13 > *", END - 0.5, 0.4);

          // ---------- 14 END CARD ----------
          tl.fromTo("#s14logo", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, END + 0.1);

          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
        }

        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
        else build();
      })();
    </script>
  </body>
</html>

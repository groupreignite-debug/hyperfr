    <script src="assets/gsap.min.js"></script>
    <style>
      /* Alexandria: one family, Arabic + Latin subsets (SIL OFL, via @fontsource/alexandria) */
      @font-face { font-family: "Alexandria"; font-weight: 300; src: url("assets/fonts/alexandria-arabic-300-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 400; src: url("assets/fonts/alexandria-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 500; src: url("assets/fonts/alexandria-arabic-500-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 700; src: url("assets/fonts/alexandria-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 800; src: url("assets/fonts/alexandria-arabic-800-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 900; src: url("assets/fonts/alexandria-arabic-900-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC; }
      @font-face { font-family: "Alexandria"; font-weight: 300; src: url("assets/fonts/alexandria-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 400; src: url("assets/fonts/alexandria-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 500; src: url("assets/fonts/alexandria-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 700; src: url("assets/fonts/alexandria-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 800; src: url("assets/fonts/alexandria-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }
      @font-face { font-family: "Alexandria"; font-weight: 900; src: url("assets/fonts/alexandria-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122, U+2212, U+2215; }

      :root {
        --orange: #ff4d1a;
        --charcoal: #1a1a1a;
        --paper: #f5f1ea;
        --gold: #ffb000;
        --paper-70: rgba(245, 241, 234, 0.7);
        --paper-55: rgba(245, 241, 234, 0.55);
        --paper-14: rgba(245, 241, 234, 0.14);
        --paper-08: rgba(245, 241, 234, 0.08);
        --muted: #6e6a64;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--charcoal); }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: var(--charcoal); color: var(--paper);
        font-family: "Alexandria", sans-serif; -webkit-font-smoothing: antialiased;
      }
      .clip { position: absolute; inset: 0; }
      .abs { position: absolute; }
      .row { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
      .ar { direction: rtl; unicode-bidi: isolate; }
      .en { direction: ltr; unicode-bidi: isolate; }
      .w { display: inline-block; }
      .or { color: var(--orange); }
      .caps { font-weight: 800; letter-spacing: 0.02em; }

      /* ---------- ground ---------- */
      #ground { overflow: hidden; }
      #grid {
        position: absolute; left: -144px; top: -144px; width: 1368px; height: 2208px;
        background-image:
          linear-gradient(rgba(245, 241, 234, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 241, 234, 0.035) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      #marks { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      #marks path { stroke: rgba(245, 241, 234, 0.09); stroke-width: 1.5; fill: none; }
      #glow {
        position: absolute; left: 90px; top: 510px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 77, 26, 0.22), rgba(255, 77, 26, 0.07) 55%, rgba(255, 77, 26, 0) 100%);
        opacity: 0;
      }
      #prog { position: absolute; left: 90px; right: 90px; top: 236px; height: 2px; background: var(--paper-08); }
      #progfill { position: absolute; inset: 0; background: var(--orange); transform-origin: 0 50%; }
      #vig {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 75% at 50% 48%, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.38) 100%);
      }

      /* ---------- shared pieces ---------- */
      .person { position: absolute; display: block; }
      .person svg { width: 100%; height: 100%; display: block; fill: currentColor; }
      [data-ic] { display: block; width: 44px; height: 44px; flex: none; }
      .ic { display: block; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .chip {
        display: flex; align-items: center; gap: 16px; height: 92px; padding: 0 36px; border-radius: 46px;
        border: 2px solid var(--paper-14); background: rgba(245, 241, 234, 0.04); font-size: 46px; font-weight: 700;
        direction: rtl; white-space: nowrap;
      }
      .chip.ico { padding: 0 28px; }
      .chip [data-ic] { width: 50px; height: 50px; }
      .chips { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 22px; direction: rtl; }
      .dot { font-size: 46px; color: var(--paper-55); }
      .badge { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--charcoal); }
      .logo-frame { position: absolute; overflow: hidden; }
      .logo-frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .logo-clip { mix-blend-mode: lighten; }
      .draw path, .draw rect, .draw circle { fill: none; stroke: var(--paper-55); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .q { position: absolute; color: var(--orange); font-weight: 900; text-align: center; direction: rtl; line-height: 1; -webkit-text-stroke: 12px var(--charcoal); paint-order: stroke fill; }

      /* the two versions: A = off-white outline card, B = solid orange card (same pairing in every scene) */
      .vA { border: 6px solid var(--paper); background: rgba(245, 241, 234, 0.03); color: var(--paper); }
      .vB { border: 6px solid var(--orange); background: var(--orange); color: var(--charcoal); }
      .fly { position: absolute; border-radius: 30px; overflow: hidden; }
      .lt { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; line-height: 1; direction: ltr; }
      .fly .tx { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; direction: rtl; line-height: 1.3; }
      .mini { position: absolute; border-radius: 6px; }
      .mini.vA { border-width: 3px; background: var(--charcoal); }
      .mini.vB { border-width: 3px; }
      .lb { position: absolute; width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 900; direction: ltr; }
      .half { display: flex; align-items: center; gap: 14px; direction: ltr; font-size: 72px; font-weight: 800; color: var(--paper); }
      .half .lb { position: relative; width: 84px; height: 84px; font-size: 50px; }

      /* neutral ad card (scenes 01 and 09) */
      .adc { position: absolute; border-radius: 28px; border: 4px solid var(--paper-14); background: #202020; }
      .adc .av { position: absolute; left: 28px; top: 26px; width: 52px; height: 52px; border-radius: 50%; background: var(--paper-14); }
      .adc .hb { position: absolute; left: 96px; top: 40px; width: 150px; height: 22px; border-radius: 11px; background: var(--paper-14); }
      .adc .im { position: absolute; left: 28px; top: 100px; right: 28px; height: 220px; border-radius: 18px; background: var(--paper-08); }
      .adc .t1 { position: absolute; left: 28px; top: 346px; width: 260px; height: 24px; border-radius: 12px; background: var(--paper-14); }
      .adc .t2 { position: absolute; left: 28px; top: 386px; width: 180px; height: 24px; border-radius: 12px; background: var(--paper-08); }
      .adc .bt { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 52px; border-radius: 26px; background: var(--paper-14); }

      /* scene 09: the ad with three parts */
      .part { position: absolute; left: 30px; right: 30px; border-radius: 18px; }
      .lay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .hbar { position: absolute; height: 30px; border-radius: 15px; }
      .plabel { position: absolute; left: 812px; display: flex; align-items: center; gap: 12px; height: 76px; padding: 0 24px; border-radius: 38px; border: 2px solid var(--paper-14); background: rgba(245, 241, 234, 0.04); font-size: 42px; font-weight: 700; direction: rtl; white-space: nowrap; }
      .plabel [data-ic] { width: 40px; height: 40px; color: var(--orange); }

      /* scene 11-12: generic social ad cards */
      .sad { position: absolute; border-radius: 30px; overflow: hidden; }
      .sad .av { position: absolute; left: 26px; top: 24px; width: 50px; height: 50px; border-radius: 50%; }
      .sad .hb { position: absolute; left: 92px; top: 38px; width: 140px; height: 22px; border-radius: 11px; }
      .sad .im { position: absolute; left: 26px; right: 26px; top: 96px; height: 250px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
      .sad .h1b { position: absolute; left: 26px; top: 372px; width: 270px; height: 26px; border-radius: 13px; }
      .sad .h2b { position: absolute; left: 26px; top: 412px; width: 190px; height: 26px; border-radius: 13px; }
      .sad .bt { position: absolute; left: 26px; right: 26px; bottom: 24px; height: 56px; border-radius: 28px; }
      .sad.vA .av, .sad.vA .hb, .sad.vA .h1b, .sad.vA .bt { background: rgba(245, 241, 234, 0.22); }
      .sad.vA .h2b { background: rgba(245, 241, 234, 0.12); }
      .sad.vA .im { background: rgba(245, 241, 234, 0.08); color: var(--paper); }
      .sad.vB .av, .sad.vB .hb, .sad.vB .h1b, .sad.vB .bt { background: rgba(26, 26, 26, 0.32); }
      .sad.vB .h2b { background: rgba(26, 26, 26, 0.2); }
      .sad.vB .im { background: var(--charcoal); color: var(--orange); }
      .sad .lt { top: 170px; font-size: 220px; }

      /* subtitles: one line at a time, bottom safe area (above the bottom 300px, clear of the right-edge icons) */
      #subs { pointer-events: none; }
      .sub { position: absolute; left: 90px; width: 840px; top: 1430px; height: 190px; display: flex; align-items: center; justify-content: center; opacity: 0; }
      .sub span {
        display: inline-block; max-width: 840px; padding: 14px 32px; border-radius: 24px;
        background: rgba(26, 26, 26, 0.86); border: 1px solid rgba(245, 241, 234, 0.1);
        font-size: 46px; font-weight: 600; line-height: 1.45; text-align: center; color: var(--paper);
        direction: rtl; unicode-bidi: isolate; white-space: normal; text-wrap: balance;
      }
      .sub b { font-weight: 700; color: var(--orange); direction: ltr; unicode-bidi: isolate; }

      /* scene 01: falling coins and the hook cards */
      .coin { position: absolute; width: 70px; height: 70px; border-radius: 50%; border: 6px solid var(--paper); background: var(--charcoal); }
      .coin::after { content: ""; position: absolute; left: 15px; top: 15px; width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--paper-55); }
      .sad .lt.big { top: 25px; font-size: 200px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0.0" data-duration="50.88" data-width="1080" data-height="1920">

      <!-- ================= GROUND (grid, marks, travelling glow, progress) ================= -->
      <div id="ground" class="clip" data-start="0.0" data-duration="50.88" data-track-index="0">
        <div id="grid" data-layout-allow-overflow></div>
        <svg id="marks" viewBox="0 0 1080 1920">
          <path d="M138 432h20M148 422v20 M922 432h20M932 422v20 M138 1380h20M148 1370v20 M922 1380h20M932 1370v20" />
          <path d="M90 1400h120 M90 1400v-10 M130 1400v-6 M170 1400v-6 M210 1400v-10" />
          <path d="M870 288h120 M990 288v10 M950 288v6 M910 288v6 M870 288v10" />
        </svg>
        <div id="glow"></div>
        <div id="prog"><div id="progfill"></div></div>
      </div>

      <!-- ================= THE TWO AD CARDS (persistent, scenes 01-03) — full at frame 0 ================= -->
      <section id="cards" class="clip" data-start="0.0" data-duration="11.58" data-track-index="3">
        <div id="coins" class="abs" style="left: 0; top: 0; width: 1080px; height: 1400px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 78%, transparent 100%); mask-image: linear-gradient(#000 78%, transparent 100%)"></div>
        <div id="cardsBox" class="abs" style="left: 0; top: 0; width: 1080px; height: 1920px" data-layout-allow-overflow>
          <div id="hA" class="sad vA" style="left: 580px; top: 380px; width: 400px; height: 580px">
            <i class="av"></i><i class="hb"></i><div class="im" style="height: 270px"><div class="lt big">A</div></div><i class="h1b" style="top: 392px"></i><i class="h2b" style="top: 432px"></i><i class="bt"></i>
          </div>
          <div id="hB" class="sad vB" style="left: 100px; top: 380px; width: 400px; height: 580px">
            <i class="av"></i><i class="hb"></i><div class="im" style="height: 270px"><div class="lt big">B</div></div><i class="h1b" style="top: 392px"></i><i class="h2b" style="top: 432px"></i><i class="bt"></i>
          </div>
        </div>
      </section>

      <!-- ================= 01 HOOK: one of these is wasting your money … which one? ================= -->
      <section id="s1" class="clip" data-start="0.0" data-duration="3.49" data-track-index="1">
        <div class="chips" style="top: 1010px; height: 92px">
          <div id="c1" class="chip ico" style="color: var(--orange)"><i data-ic="cash" style="width: 58px; height: 58px"></i></div>
        </div>
        <div id="q1" class="q" style="left: 380px; top: 470px; width: 320px; font-size: 340px; -webkit-text-stroke: 16px var(--charcoal)">؟</div>
      </section>

      <!-- ================= 02 GUT: your feeling points at A, the dart misses ================= -->
      <section id="s2" class="clip" data-start="3.49" data-duration="2.41" data-track-index="1">
        <div id="heart2" class="badge" style="left: 725px; top: 268px; width: 110px; height: 110px; border: 4px solid var(--orange); color: var(--orange)"><i data-ic="heart" style="width: 62px; height: 62px"></i></div>
        <svg id="dart2" class="abs" style="left: 80px; top: 1150px; width: 150px; height: 40px" viewBox="0 0 150 40" data-layout-allow-overflow>
          <path d="M8 20 H120 M120 20 L104 10 M120 20 L104 30 M8 20 L-2 10 M8 20 L-2 30 M20 20 L10 10 M20 20 L10 30" fill="none" stroke="#F5F1EA" stroke-width="5" stroke-linecap="round" />
          <path d="M120 20 L146 20" stroke="#FF4D1A" stroke-width="6" stroke-linecap="round" />
        </svg>
        <div class="chips" style="top: 1090px; height: 92px">
          <div id="c2a" class="chip"><i data-ic="heart" class="or"></i><span>شعورك</span></div>
          <span id="d2" class="dot">·</span>
          <div id="c2b" class="chip"><i data-ic="target" class="or"></i><span>تخمين</span></div>
        </div>
      </section>

      <!-- ================= 03 TERM: A/B Testing, people decide ================= -->
      <section id="s3" class="clip" data-start="5.9" data-duration="5.68" data-track-index="1">
        <div id="t3" class="row en or" style="top: 270px; font-size: 140px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15">A/B Testing</div>
        <div id="ok3" class="badge" style="left: 150px; top: 436px; width: 96px; height: 96px; border: 4px solid var(--paper); color: var(--paper)"><i data-ic="check" style="width: 58px; height: 58px"></i></div>
        <div id="crowd3" class="abs" style="left: 0; top: 975px; width: 1080px; height: 90px"></div>
        <div class="chips" style="top: 1100px; height: 92px">
          <div id="c3" class="chip ico"><i data-ic="users" class="or"></i></div>
        </div>
      </section>

      <!-- ================= THE JUICE SHOP (persistent set, scenes 04-06) ================= -->
      <section id="shop" class="clip" data-start="11.58" data-duration="14.06" data-track-index="3">
        <svg id="shopDraw" class="abs draw" style="left: 0; top: 0; width: 1080px; height: 1920px" viewBox="0 0 1080 1920">
          <path class="sp" pathLength="1" d="M80 1180 H1000" />
          <path class="sp" pathLength="1" d="M230 1180 V660 M850 1180 V660" />
          <path class="sp" pathLength="1" d="M200 660 L240 580 H840 L880 660 Z" />
          <path class="sp" pathLength="1" d="M330 580 L320 660 M420 580 L415 660 M510 580 L510 660 M600 580 L605 660 M690 580 L700 660 M770 580 L785 660" />
          <rect class="sp" pathLength="1" x="400" y="480" width="280" height="76" rx="14" />
          <path class="sp" pathLength="1" d="M240 960 H660 M255 960 V1180 M645 960 V1180" />
          <path class="sp" pathLength="1" d="M300 1030 H600 M300 1100 H600" />
          <rect class="sp" pathLength="1" x="700" y="820" width="130" height="360" rx="6" />
          <circle class="sp" pathLength="1" cx="722" cy="1000" r="6" />
        </svg>
        <div id="sign4" class="abs" style="left: 512px; top: 490px; width: 56px; height: 56px; color: var(--orange)"><i data-ic="orange" style="width: 56px; height: 56px"></i></div>
        <!-- the juicer, the oranges and the flyer stack on the counter -->
        <svg id="juicer" class="abs" style="left: 280px; top: 840px; width: 110px; height: 120px" viewBox="0 0 110 120">
          <path d="M15 118 H95 M25 118 V96 H85 V118 M30 96 Q30 70 55 64 Q80 70 80 96 M55 64 V40 M40 40 H70 L62 20 H48 Z M85 104 H100 V86" fill="none" stroke="#F5F1EA" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg id="oranges" class="abs" style="left: 400px; top: 872px; width: 120px; height: 88px" viewBox="0 0 120 88">
          <circle cx="30" cy="62" r="24" fill="none" stroke="#FF4D1A" stroke-width="4" />
          <circle cx="86" cy="62" r="24" fill="none" stroke="#FF4D1A" stroke-width="4" />
          <circle cx="58" cy="28" r="24" fill="none" stroke="#FF4D1A" stroke-width="4" />
        </svg>
        <div id="stack" class="abs" style="left: 540px; top: 904px; width: 96px; height: 56px">
          <i class="mini vB" style="left: 0; top: 40px; width: 90px; height: 16px; border-radius: 4px"></i>
          <i class="mini vA" style="left: 4px; top: 30px; width: 90px; height: 16px; border-radius: 4px"></i>
          <i class="mini vB" style="left: 2px; top: 20px; width: 90px; height: 16px; border-radius: 4px"></i>
          <i class="mini vA" style="left: 6px; top: 10px; width: 90px; height: 16px; border-radius: 4px"></i>
          <i class="mini vB" style="left: 3px; top: 0; width: 90px; height: 16px; border-radius: 4px"></i>
        </div>
        <!-- scene 06: the two piles grow on the counter (no numbers) -->
        <div id="pileA" class="abs" style="left: 470px; top: 760px; width: 100px; height: 200px"></div>
        <div id="pileB" class="abs" style="left: 300px; top: 760px; width: 100px; height: 200px"></div>
        <div id="lbA7" class="lb vA" style="left: 474px; top: 1022px; background: var(--charcoal)">A</div>
        <div id="lbB7" class="lb vB" style="left: 304px; top: 1022px">B</div>
        <div id="walk7" class="abs" style="left: 0; top: 0; width: 1080px; height: 1920px" data-layout-allow-overflow></div>
      </section>

      <!-- ================= 04 SHOP ================= -->
      <section id="s4" class="clip" data-start="11.58" data-duration="2.72" data-track-index="1">
        <div class="chips" style="top: 1240px; height: 104px">
          <div id="c4" class="chip ico" style="height: 104px; color: var(--orange)"><i data-ic="orange" style="width: 58px; height: 58px"></i></div>
        </div>
      </section>

      <!-- ================= 05 THE FLYERS ================= -->
      <section id="s5" class="clip" data-start="14.3" data-duration="5.26" data-track-index="2">
        <div id="flyA" class="fly vA" style="left: 570px; top: 480px; width: 400px; height: 580px" data-layout-allow-overflow>
          <div class="lt" style="top: 50px; font-size: 170px">A</div>
          <div id="txA" class="tx" style="top: 330px; font-size: 64px">عصير طازة</div>
          <i class="abs" style="left: 120px; top: 470px; width: 160px; height: 14px; border-radius: 7px; background: var(--paper-14)"></i>
        </div>

          tl.fromTo("#s14logo", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, END + 0.1);

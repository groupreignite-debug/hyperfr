<!doctype html>
<html lang="ar" dir="rtl">
  <head>

    <title>Incrementality vs ROAS — 6/7</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>

      .pair { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 110px; }

      .lab { font-size: 32px; margin-bottom: 10px; white-space: nowrap; }
      .seen { font-size: 130px; color: rgba(245, 241, 234, 0.55); }
      .seen .strike::after { height: 4px; }
      .real { font-size: 150px; }
      .text.big { font-size: 44px; line-height: 1.6; }

  </head>
  <body>
    <div class="page">
      <header class="head">

      <main class="body">

        <div class="pair">
          <div class="cell">
            <div class="latin-tag muted lab"><bdi>ROAS</bdi></div>
            <div class="num ltr seen"><span class="strike">3.0X</span></div>
          </div>
          <svg class="arrow" width="96" height="48" viewBox="0 0 48 24" aria-hidden="true"><path d="M46 12H4M13 3L3 12l10 9" fill="none" stroke="#FF4D1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="cell">
            <div class="latin-tag or lab"><bdi>INCREMENTAL ROAS</bdi></div>
            <div class="num ltr gold real">1.1X</div>

        </div>
        <div class="text big">الرقم اللي بتشوفو بالمنصة… مش دايماً الرقم الحقيقي.</div>

    </div>
